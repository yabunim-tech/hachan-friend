<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내칭기칭기는 다마고치</title>
<!-- 웹으로 공개할 때 홈 화면·Dock에 추가하면 앱처럼 뜨게 하는 정보(deploy/에 아이콘과 함께 있음) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="내칭기칭기는 다마고치">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1e21" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 톤: 디자인 시스템/오늘의집_DESIGN.md — 흰 바탕, 짙은 회색 글, 파란색은 행동 버튼에만, 4px 모서리, 포커스는 그림자 링 */
:root {
  --canvas: #ffffff;
  --paper: #f7f9fa;
  --fg: #2f3438;
  --body: #424242;
  --muted: #828c94;
  --line: #e0e0e0;
  --line-soft: #eaedef;
  --action: #00a1ff;
  --action-hover: #0497ef;
  --ring: #ddf3ff;
  --low: #ff7777;        /* 게이지가 낮을 때만 */
  --shadow: 0 2px 5px rgba(63, 71, 77, 0.15);
  --sprite-filter: none;
  --sans: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #1b1e21; --paper: #131517; --fg: #eef1f3; --body: #d5d9dc; --muted: #8f99a1;
    --line: #34393d; --line-soft: #2a2e32; --ring: #0d4466; --low: #ff8a8a;
    --shadow: 0 2px 5px rgba(0, 0, 0, 0.4); --sprite-filter: invert(1); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --canvas: #1b1e21; --paper: #131517; --fg: #eef1f3; --body: #d5d9dc; --muted: #8f99a1;
  --line: #34393d; --line-soft: #2a2e32; --ring: #0d4466; --low: #ff8a8a;
  --shadow: 0 2px 5px rgba(0, 0, 0, 0.4); --sprite-filter: invert(1); color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--paper); }
body {
  color: var(--body); font-family: var(--sans); font-size: 15px; letter-spacing: -0.3px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; letter-spacing: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring); }

.app {
  max-width: 440px; min-height: 100dvh; margin: 0 auto; background: var(--canvas);
  display: flex; flex-direction: column;
  padding: max(12px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
}
header { display: flex; align-items: center; gap: 8px; height: 48px; }
header h1 { flex: 1; margin: 0; font-size: 18px; font-weight: 700; color: var(--fg); }
.icon-btn {
  width: 36px; height: 36px; border: 0; background: transparent; border-radius: 4px;
  display: grid; place-items: center; color: var(--fg);
}
.icon-btn:hover { background: var(--paper); }
.icon-btn svg { width: 20px; height: 20px; }
.coin {
  display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px;
  border: 1px solid var(--line); border-radius: 24px; font-size: 14px; font-weight: 700; color: var(--fg);
}
.coin i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--action); display: inline-block; }
.coin.bump { animation: bump .4s; }
@keyframes bump { 40% { transform: scale(1.15); } }

/* ---------- 입양 화면 ---------- */
.adopt h2 { margin: 20px 0 4px; font-size: 22px; font-weight: 700; color: var(--fg); }
.adopt p.lead { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
.picks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pick {
  border: 1px solid var(--line); background: var(--canvas); border-radius: 4px; padding: 12px 6px 10px;
  display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
}
.pick[aria-pressed="true"] { border-color: var(--action); box-shadow: 0 0 0 1px var(--action); }
.pick .thumb { height: 84px; display: grid; place-items: center; }
.pick img { max-height: 84px; max-width: 84px; filter: var(--sprite-filter); }
.pick b { font-size: 15px; color: var(--fg); }
.pick small { font-size: 12px; color: var(--muted); line-height: 1.35; }
.detail { margin: 16px 0; padding: 14px 16px; background: var(--paper); border-radius: 4px; font-size: 14px; }
.detail dl { margin: 0; display: grid; grid-template-columns: 64px 1fr; row-gap: 4px; }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; color: var(--fg); }
label.field { display: block; font-size: 14px; font-weight: 700; color: var(--fg); margin-bottom: 6px; }
.text-input {
  width: 100%; height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 4px;
  background: var(--canvas); color: var(--fg); font-size: 15px;
}
.text-input:focus { outline: none; border-color: var(--action); box-shadow: 0 0 0 3px var(--ring); }
.btn {
  height: 48px; border: 0; border-radius: 4px; padding: 0 16px; font-size: 16px; font-weight: 700;
  background: var(--action); color: #fff; width: 100%;
}
.btn:hover, .btn:active { background: var(--action-hover); }
.btn:disabled { background: var(--line); color: var(--muted); cursor: default; }
.btn.line { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn.line:hover { background: var(--paper); }
.adopt .btn { margin-top: 16px; }
.hint { margin-top: 8px; font-size: 13px; color: var(--muted); }

/* ---------- 키우기 화면 ---------- */
.who { display: flex; align-items: baseline; gap: 8px; margin-top: 8px; }
.who b { font-size: 22px; font-weight: 700; color: var(--fg); }
.who span { font-size: 14px; color: var(--muted); }
.lv { margin-left: auto; font-size: 14px; color: var(--fg); font-weight: 700; }
.xp { height: 4px; background: var(--line-soft); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.xp i { display: block; height: 100%; background: var(--action); transition: width .4s; }

.stage {
  position: relative; margin-top: 14px; height: 300px; border-radius: 4px; background: var(--paper);
  overflow: hidden; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 44px;
  user-select: none; -webkit-user-select: none;
}
.stage::after { /* 바닥 선 */
  content: ""; position: absolute; left: 24px; right: 24px; bottom: 40px; height: 1px; background: var(--line);
}
/* ---------- 캐릭터: 머리·팔·다리를 관절(회전 중심)마다 따로 움직인다 ----------
   팔: 왼팔은 시계 방향(+), 오른팔은 반시계 방향(-)이 위로 드는 쪽.
   --ha: 머리 흔들림 세기(머리가 큰 캐릭터일수록 작게) */
.pet {
  position: relative; z-index: 2; border: 0; background: none; padding: 0;
  transition-property: transform; transition-timing-function: linear;
}
.pet[data-kind="sprout"] { --ha: 1; }
.pet[data-kind="flat"]   { --ha: .45; }
.pet[data-kind="tall"]   { --ha: .6; }
.flip { transition: transform .2s; }
.flip.left { transform: scaleX(-1); }
.rig { position: relative; transform-origin: 50% 100%; animation: breathe 3.2s ease-in-out infinite; }
.part { position: absolute; inset: 0; }
.part img { position: absolute; inset: 0; width: 100%; height: 100%; filter: var(--sprite-filter); pointer-events: none; transition: opacity .4s; }
.p-head { animation: headIdle 4.4s ease-in-out infinite; }
.p-leaf { animation: leafIdle 2.6s ease-in-out infinite; }
.p-armL { animation: armLIdle 3.2s ease-in-out infinite; }
.p-armR { animation: armRIdle 3.2s ease-in-out infinite; }
@keyframes breathe  { 50% { transform: scale(.985, 1.03); } }
@keyframes headIdle { 0%, 100% { transform: rotate(calc(var(--ha) * -3deg)); } 50% { transform: rotate(calc(var(--ha) * 3deg)); } }
@keyframes leafIdle { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(12deg); } }
@keyframes armLIdle { 50% { transform: rotate(12deg); } }
@keyframes armRIdle { 50% { transform: rotate(-12deg); } }

/* 시무룩: 고개 푹, 팔 축, 새싹 시듦 */
.pet.sulky .rig    { animation: sulkBody 4.5s ease-in-out infinite; }
.pet.sulky .p-head { animation: sulkHead 4.5s ease-in-out infinite; }
.pet.sulky .p-armL { animation: none; transform: rotate(-28deg); }
.pet.sulky .p-armR { animation: none; transform: rotate(28deg); }
.pet.sulky .p-leaf { animation: none; transform: rotate(45deg); }
.pet.sulky .part img { opacity: .6; }
@keyframes sulkBody { 0%, 100% { transform: scale(1.01, .96); } 50% { transform: scale(1.02, .94); } }
@keyframes sulkHead { 0%, 100% { transform: rotate(calc(var(--ha) * 12deg)) translateY(1.5%); } 50% { transform: rotate(calc(var(--ha) * 16deg)) translateY(2.5%); } }

/* 걷기: 다리 번갈아 + 팔은 반대로 + 몸 통통 */
.pet.walking .rig    { animation: walkBob .5s ease-in-out infinite; }
.pet.walking .p-legL { animation: legSwing .5s ease-in-out infinite; }
.pet.walking .p-legR { animation: legSwing .5s ease-in-out infinite reverse; }
.pet.walking .p-armL { animation: armLSwing .5s ease-in-out infinite; }
.pet.walking .p-armR { animation: armRSwing .5s ease-in-out infinite; }
.pet.walking .p-head { animation: headWalk .5s ease-in-out infinite; }
.pet.walking .p-leaf { animation: leafIdle .5s ease-in-out infinite; }
.pet.sulky.walking .rig { animation-duration: .9s; }
@keyframes walkBob  { 25%, 75% { transform: translateY(-5px); } 0%, 50%, 100% { transform: translateY(0) scaleY(.97); } }
@keyframes legSwing { 0%, 100% { transform: rotate(20deg); } 50% { transform: rotate(-20deg); } }
@keyframes armLSwing { 0%, 100% { transform: rotate(-14deg); } 50% { transform: rotate(22deg); } }
@keyframes armRSwing { 0%, 100% { transform: rotate(-22deg); } 50% { transform: rotate(14deg); } }
@keyframes headWalk { 25% { transform: rotate(calc(var(--ha) * -3deg)); } 75% { transform: rotate(calc(var(--ha) * 3deg)); } }

/* 먹기: 음식 쪽으로 고개 들기 → 두 손 모아 입으로 → 오물오물 + 발 동동 */
.pet.eating .rig    { animation: eatBody 1.7s ease-in-out; }
.pet.eating .p-head { animation: eatHead 1.7s ease-in-out; }
.pet.eating .p-armL { animation: eatArmL 1.7s ease-in-out; }
.pet.eating .p-armR { animation: eatArmR 1.7s ease-in-out; }
.pet.eating .p-legL { animation: tapL .34s ease-in-out 5; }
.pet.eating .p-legR { animation: tapR .34s ease-in-out 5; }
.pet.eating .p-leaf { animation: leafIdle .3s ease-in-out 6; }
@keyframes eatBody {
  15% { transform: translateY(-6px) scale(.98, 1.04); }
  30%, 46%, 62%, 78% { transform: scale(1.04, .93); }
  38%, 54%, 70%, 86% { transform: scale(.99, 1.02); }
}
@keyframes eatHead {
  15% { transform: rotate(calc(var(--ha) * -10deg)); }
  30%, 46%, 62%, 78% { transform: rotate(calc(var(--ha) * 7deg)) translateY(2%); }
  38%, 54%, 70%, 86% { transform: rotate(calc(var(--ha) * -2deg)); }
}
@keyframes eatArmL { 20% { transform: rotate(62deg); } 40%, 72% { transform: rotate(50deg); } 56%, 86% { transform: rotate(64deg); } }
@keyframes eatArmR { 20% { transform: rotate(-62deg); } 40%, 72% { transform: rotate(-50deg); } 56%, 86% { transform: rotate(-64deg); } }
@keyframes tapL { 50% { transform: rotate(-12deg); } }
@keyframes tapR { 50% { transform: rotate(12deg); } }

/* 춤: 좌우로 스텝 + 점프, 팔은 번갈아 머리 위로, 다리 킥, 새싹 빙글 */
.pet.dancing .rig    { animation: danceBody .9s ease-in-out 3; }
.pet.dancing .p-head { animation: danceHead .45s ease-in-out 6 alternate; }
.pet.dancing .p-armL { animation: danceArmL .9s ease-in-out 3; }
.pet.dancing .p-armR { animation: danceArmR .9s ease-in-out 3; }
.pet.dancing .p-legL { animation: danceLegL .9s ease-in-out 3; }
.pet.dancing .p-legR { animation: danceLegR .9s ease-in-out 3; }
.pet.dancing .p-leaf { animation: spin .9s linear 3; }
@keyframes danceBody {
  0%, 100% { transform: translate(0, 0); }
  12.5% { transform: translate(-6px, -16px) rotate(-6deg); }
  25%   { transform: translate(-9px, 0) rotate(-8deg) scale(1.04, .92); }
  37.5% { transform: translate(0, -18px); }
  50%   { transform: translate(9px, 0) rotate(8deg) scale(1.04, .92); }
  62.5% { transform: translate(6px, -14px) rotate(4deg); }
  75%   { transform: translate(0, 0) scale(1.03, .95); }
  87.5% { transform: translate(0, -24px) scale(.97, 1.05); }
}
@keyframes danceHead { from { transform: rotate(calc(var(--ha) * -13deg)); } to { transform: rotate(calc(var(--ha) * 13deg)); } }
@keyframes danceArmL { 0%, 100% { transform: rotate(0); } 25%, 75% { transform: rotate(95deg); } 50% { transform: rotate(15deg); } }
@keyframes danceArmR { 0%, 100% { transform: rotate(-90deg); } 25%, 75% { transform: rotate(-10deg); } 50% { transform: rotate(-95deg); } }
@keyframes danceLegL { 12.5% { transform: rotate(28deg); } 25% { transform: rotate(0); } 87.5% { transform: rotate(18deg); } }
@keyframes danceLegR { 37.5% { transform: rotate(-28deg); } 50% { transform: rotate(0); } 87.5% { transform: rotate(-18deg); } }
@keyframes spin { to { transform: rotate(360deg); } }

/* 쓰다듬기: 손 쪽으로 고개 기울이고 팔 파닥 */
.pet.petted .rig    { animation: petBody .8s ease-in-out; }
.pet.petted .p-head { animation: petHead .8s ease-in-out; }
.pet.petted .p-armL { animation: flapL .4s ease-in-out 2; }
.pet.petted .p-armR { animation: flapR .4s ease-in-out 2; }
.pet.petted .p-leaf { animation: leafIdle .4s ease-in-out 2; }
@keyframes petBody { 30% { transform: scale(1.05, .92); } 60% { transform: scale(.98, 1.04); } }
@keyframes petHead { 30% { transform: rotate(calc(var(--ha) * 11deg)); } 60% { transform: rotate(calc(var(--ha) * -4deg)); } }
@keyframes flapL { 50% { transform: rotate(48deg); } }
@keyframes flapR { 50% { transform: rotate(-48deg); } }

/* 씻기: 몸 부르르 + 두 팔로 박박 + 고개 도리도리 */
.pet.washing .rig    { animation: shake .18s linear 8; }
.pet.washing .p-armL { animation: rubL .18s linear 8; }
.pet.washing .p-armR { animation: rubR .18s linear 8; }
.pet.washing .p-head { animation: headShake .36s ease-in-out 4; }
.pet.washing .p-legL { animation: tapL .36s ease-in-out 4; }
.pet.washing .p-legR { animation: tapR .36s ease-in-out 4 .18s; }
.pet.washing .p-leaf { animation: leafIdle .18s linear 8; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@keyframes rubL { 0%, 100% { transform: rotate(30deg); } 50% { transform: rotate(70deg); } }
@keyframes rubR { 0%, 100% { transform: rotate(-30deg); } 50% { transform: rotate(-70deg); } }
@keyframes headShake { 25% { transform: rotate(calc(var(--ha) * -7deg)); } 75% { transform: rotate(calc(var(--ha) * 7deg)); } }

/* 기분 좋을 때 가끔: 만세 점프 */
.pet.hopping .rig    { animation: hop .7s ease-out; }
.pet.hopping .p-armL { animation: cheerL .7s ease-out; }
.pet.hopping .p-armR { animation: cheerR .7s ease-out; }
.pet.hopping .p-legL { animation: tuckL .7s ease-out; }
.pet.hopping .p-legR { animation: tuckR .7s ease-out; }
@keyframes hop { 15% { transform: scale(1.06, .9); } 45% { transform: translateY(-30px) scale(.96, 1.06); } 75% { transform: scale(1.05, .93); } }
@keyframes cheerL { 20%, 70% { transform: rotate(110deg); } }
@keyframes cheerR { 20%, 70% { transform: rotate(-110deg); } }
@keyframes tuckL { 45% { transform: rotate(22deg); } }
@keyframes tuckR { 45% { transform: rotate(-22deg); } }

.bubble {
  position: absolute; left: 50%; transition: left .4s, opacity .25s; top: 14px; transform: translateX(-50%); z-index: 3;
  max-width: calc(100% - 32px); width: max-content; padding: 10px 14px; border-radius: 4px;
  background: var(--canvas); color: var(--fg); box-shadow: var(--shadow); font-size: 15px; line-height: 1.45; text-align: center;

}
.bubble::after {
  content: ""; position: absolute; left: 50%; bottom: -6px; width: 12px; height: 12px; margin-left: -6px;
  background: var(--canvas); transform: rotate(45deg); box-shadow: 3px 3px 4px rgba(63,71,77,.08);
}
.bubble.fade { opacity: 0; }
.mood-tag {
  position: absolute; left: 12px; bottom: 10px; z-index: 3; font-size: 13px; color: var(--muted);
}
.mood-tag.low { color: var(--low); font-weight: 700; }

/* 날아가는 음식, 하트, 비눗방울, 음표 */
.fx { position: absolute; z-index: 4; pointer-events: none; color: var(--fg); }
.fx svg { width: 100%; height: 100%; display: block; }
.food-fly { width: 44px; height: 44px; transition: opacity .3s; animation: fly .55s cubic-bezier(.3,.7,.4,1) forwards; }
@keyframes fly { from { transform: translate(0, 0) scale(.6); } to { transform: translate(var(--tx), var(--ty)) scale(1); } }
.food-fly.bite1 { clip-path: circle(42% at 40% 55%); }
.food-fly.bite2 { clip-path: circle(28% at 35% 60%); }
.float-up { animation: floatUp 1.2s ease-out forwards; }
@keyframes floatUp { from { opacity: 1; transform: translate(0,0) scale(.8); } to { opacity: 0; transform: translate(var(--dx, 0px), -90px) scale(1.1); } }
.note { font-size: 22px; font-weight: 700; color: var(--action); }
.heart { width: 22px; height: 22px; color: var(--low); }
.soap { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--action); opacity: .8; }
.munch { font-size: 14px; font-weight: 700; color: var(--fg); }

.gauges { margin-top: 16px; display: grid; gap: 10px; }
.gauge { display: grid; grid-template-columns: 52px 1fr 34px; align-items: center; gap: 10px; font-size: 14px; }
.gauge span { color: var(--fg); }
.gauge .bar { height: 8px; background: var(--line-soft); border-radius: 4px; overflow: hidden; }
.gauge .bar i { display: block; height: 100%; background: var(--fg); border-radius: 4px; transition: width .5s, background .3s; }
.gauge.low .bar i { background: var(--low); }
.gauge em { font-style: normal; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.gauge.low em { color: var(--low); font-weight: 700; }

.actions { margin-top: 18px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.act {
  border: 1px solid var(--line); background: var(--canvas); border-radius: 4px; height: 76px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--fg);
}
.act:hover { background: var(--paper); }
.act svg { width: 26px; height: 26px; }
.act b { font-size: 14px; font-weight: 700; }
.act small { font-size: 11px; color: var(--muted); line-height: 1; }
.act:disabled { color: var(--muted); cursor: default; background: var(--canvas); }
.act:disabled svg { opacity: .4; }
.footnote { margin-top: 14px; text-align: center; font-size: 12px; color: var(--muted); }

/* 아래에서 올라오는 시트(음식 가게·설정) */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 440px; background: var(--canvas); border-radius: 12px 12px 0 0;
  padding: 18px 16px max(16px, env(safe-area-inset-bottom)); animation: up .22s ease-out;
}
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sheet h3 { margin: 0 0 4px; font-size: 18px; font-weight: 700; color: var(--fg); }
.sheet .sub { margin: 0 0 14px; font-size: 13px; color: var(--muted); }
.menu { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.food {
  border: 1px solid var(--line); background: var(--canvas); border-radius: 4px; padding: 12px;
  display: grid; grid-template-columns: 40px 1fr; grid-template-rows: auto auto; column-gap: 10px; text-align: left; align-items: center;
}
.food:hover { background: var(--paper); }
.food svg { grid-row: span 2; width: 40px; height: 40px; color: var(--fg); }
.food b { font-size: 15px; color: var(--fg); display: flex; align-items: center; gap: 6px; }
.food small { font-size: 12px; color: var(--muted); }
.food .fav { font-size: 11px; font-weight: 700; color: var(--action); }
.food:disabled { opacity: .45; cursor: default; }
.sheet .btn.line { margin-top: 12px; }
.row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line-soft); font-size: 15px; color: var(--fg); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; background: transparent; height: 32px; padding: 0 12px; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--action); color: #fff; }
.danger { color: var(--low); }

.toast {
  position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 30;
  background: var(--fg); color: var(--canvas); padding: 10px 16px; border-radius: 4px; font-size: 14px;
  animation: up .2s ease-out;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>내칭기칭기는 다마고치</h1>
    <span class="coin" id="coin" hidden><i></i><span id="coinNum">0</span></span>
    <button class="icon-btn" id="openSettings" aria-label="설정">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </header>

  <!-- 입양 -->
  <section class="adopt" id="adopt" hidden>
    <h2>어떤 친구를 데려갈까요?</h2>
    <p class="lead">하찮지만 소중한 친구를 골라 이름을 지어 주세요.</p>
    <div class="picks" id="picks"></div>
    <div class="detail" id="pickDetail"></div>
    <label class="field" for="nameInput">이름</label>
    <input class="text-input" id="nameInput" maxlength="8" placeholder="최대 8자" autocomplete="off">
    <button class="btn" id="adoptBtn" disabled>입양하기</button>
    <p class="hint">시작 코인 30개를 드려요. 게이지가 낮아져도 친구는 시무룩해질 뿐 떠나지 않아요.</p>
  </section>

  <!-- 키우기 -->
  <section id="home" hidden>
    <div class="who"><b id="petName"></b><span id="petKind"></span><span class="lv" id="lv"></span></div>
    <div class="xp"><i id="xpBar"></i></div>
    <div class="stage" id="stage">
      <div class="bubble" id="bubble"></div>
      <button class="pet" id="pet" aria-label="쓰다듬기"><div class="flip" id="flip"><div class="rig" id="rig"></div></div></button>
      <span class="mood-tag" id="moodTag"></span>
    </div>
    <div class="gauges" id="gauges"></div>
    <div class="actions">
      <button class="act" id="actFeed"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15h22a11 11 0 0 1-22 0Z"/><path d="M12 26h8M11 10c0-2 2-2 2-4M17 10c0-2 2-2 2-4"/></svg><b>밥 주기</b><small>코인 사용</small></button>
      <button class="act" id="actWash"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="19" r="6"/><circle cx="21" cy="12" r="4"/><circle cx="22" cy="23" r="3"/></svg><b>씻기기</b><small id="washSub">+2코인</small></button>
      <button class="act" id="actPet"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M16 26s-10-6-10-13a5.5 5.5 0 0 1 10-3 5.5 5.5 0 0 1 10 3c0 7-10 13-10 13Z"/></svg><b>쓰다듬기</b><small>+1코인</small></button>
      <button class="act" id="actDance"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 24V8l14-3v16"/><circle cx="9" cy="24" r="3"/><circle cx="23" cy="21" r="3"/></svg><b>춤추기</b><small id="danceSub">기분 +</small></button>
    </div>
    <p class="footnote">친구를 직접 눌러도 쓰다듬을 수 있어요</p>
  </section>
</div>

<!-- 음식 가게 -->
<div class="scrim" id="shop" hidden>
  <div class="sheet" role="dialog" aria-label="음식 고르기">
    <h3>무엇을 먹일까요?</h3>
    <p class="sub" id="shopSub"></p>
    <div class="menu" id="menu"></div>
    <button class="btn line" data-close>닫기</button>
  </div>
</div>

<!-- 설정 -->
<div class="scrim" id="settings" hidden>
  <div class="sheet" role="dialog" aria-label="설정">
    <h3>설정</h3>
    <div class="row">화면 모드
      <div class="seg" id="themeSeg">
        <button data-theme="auto">자동</button><button data-theme="light">라이트</button><button data-theme="dark">다크</button>
      </div>
    </div>
    <div class="row" id="resetRow">처음부터 다시 입양 <button class="btn line" id="resetBtn" style="width:auto;height:36px;margin:0;font-size:14px">다시 입양하기</button></div>
    <button class="btn line" data-close>닫기</button>
  </div>
</div>

// 맥 앱에서는 앱 옆 파일에, 브라우저에서는 localStorage에 저장한다.
// (함수로 둔다: 맨 위에서 load()가 먼저 불리기 때문)
function native() { return window.__hachanStore && window.webkit?.messageHandlers?.store; }
function storeGet(key) {
  if (native()) return window.__hachanStore[key] ?? null;
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function storeSet(key, value) {
  if (native()) { window.__hachanStore[key] = value; native().postMessage(JSON.stringify(window.__hachanStore)); return; }
  try { value === null ? localStorage.removeItem(key) : localStorage.setItem(key, value); } catch (e) {}
}
function load() {
  try { return JSON.parse(storeGet(STORE_KEY)) || null; } catch (e) { return null; }
}
function save() { storeSet(STORE_KEY, JSON.stringify(S)); }
const clamp = (v) => Math.max(0, Math.min(100, v));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const xpNeed = (lv) => 40 + lv * 20;

// 지난 시간만큼 게이지를 줄인다(자리 비운 시간은 최대 4시간까지)
function decay(now) {
  const dt = Math.min(now - S.last, OFFLINE_CAP);
  S.last = now;
  if (dt <= 0) return;
  const hours = dt / 3600000;
  const weak = CHARS[S.kind].weak;
  for (const k of Object.keys(BASE_DECAY)) {
    S[k] = clamp(S[k] - BASE_DECAY[k] * (k === weak ? 1.4 : 1) * hours);
  }
}

function state() {
  if (S.full < LOW) return "hungry";
  if (S.clean < LOW) return "dirty";
  if (S.mood < LOW) return "bored";
  if (S.full >= HAPPY && S.mood >= HAPPY && S.clean >= HAPPY) return "happy";
  return "idle";
}

/* ---------- 화면 그리기 ---------- */
function renderAdopt() {
  $("adopt").hidden = false; $("home").hidden = true; $("coin").hidden = true;
  $("resetRow").hidden = true;
  let chosen = "sprout";
  const picks = $("picks"); picks.innerHTML = "";
  for (const [k, c] of Object.entries(CHARS)) {
    const b = document.createElement("button");
    b.className = "pick"; b.dataset.kind = k;
    b.innerHTML = `<div class="thumb"><img src="${SPRITES[k]}" alt=""></div><b>${c.name}</b><small>${c.trait}</small>`;
    b.onclick = () => { chosen = k; sync(); };
    picks.appendChild(b);
  }
  const input = $("nameInput");
  function sync() {
    picks.querySelectorAll(".pick").forEach((b) => b.setAttribute("aria-pressed", b.dataset.kind === chosen));
    const c = CHARS[chosen];
    const favName = FOODS.find((f) => f.id === c.fav).name;
    $("pickDetail").innerHTML = `<dl><dt>성격</dt><dd>${c.trait}</dd><dt>최애 간식</dt><dd>${favName}</dd><dt>특징</dt><dd>${c.weakLabel} (40% 더 빨리)</dd></dl>`;
    input.placeholder = `${c.name} (최대 8자)`;
    $("adoptBtn").disabled = false;
  }
  sync();
  $("adoptBtn").onclick = () => {
    const name = input.value.trim() || CHARS[chosen].name;
    S = { kind: chosen, name, coins: 30, full: 80, mood: 80, clean: 80, level: 1, xp: 0, last: Date.now(), born: Date.now() };
    save(); input.value = "";
    renderHome();
    say(pick(CHARS[S.kind].lines.happy), 4000);
    dance(false);
  };
}

function renderHome() {
  $("adopt").hidden = true; $("home").hidden = false; $("coin").hidden = false; $("resetRow").hidden = false;
  const c = CHARS[S.kind];
  $("petName").textContent = S.name;
  $("petKind").textContent = `${c.name} · ${c.trait}`;
  buildRig(S.kind);
  $("gauges").innerHTML = Object.keys(STAT_LABEL).map((k) =>
    `<div class="gauge" data-k="${k}"><span>${STAT_LABEL[k]}</span><div class="bar"><i></i></div><em></em></div>`).join("");
  update();
  scheduleIdle();
  scheduleWander();
}

// 조각들을 원래 그림과 같은 크기로 겹쳐 쌓고, 관절 위치를 회전 중심으로 잡는다. 새싹은 머리에 붙여 같이 움직인다.
function buildRig(kind) {
  const r = RIG[kind], size = RIG_SIZE[kind], rig = $("rig");
  const w = size.w || size.h * r.w / r.h, h = size.h || size.w * r.h / r.w;
  rig.style.width = w + "px"; rig.style.height = h + "px";
  rig.innerHTML = "";
  const make = (name) => {
    const d = document.createElement("div");
    d.className = "part p-" + name;
    const [ox, oy] = r.joints[name];
    d.style.transformOrigin = `${ox}% ${oy}%`;
    d.innerHTML = `<img alt="" src="${r.parts[name]}">`;
    return d;
  };
  for (const name of ["legL", "legR", "body", "armL", "armR"]) rig.appendChild(make(name));
  const head = make("head");
  if (r.parts.leaf) head.appendChild(make("leaf"));
  rig.appendChild(head);
  $("pet").dataset.kind = kind;
  petX = 0; $("pet").style.transitionDuration = "0s"; $("pet").style.transform = ""; $("flip").classList.remove("left");
  $("bubble").style.left = "50%";
}

// 가끔 무대 위를 걸어 다닌다. 기분 좋으면 만세 점프도 한다.
let petX = 0, wanderTimer = 0, walkEnd = 0;
function scheduleWander() {
  clearTimeout(wanderTimer);
  wanderTimer = setTimeout(() => { wander(); scheduleWander(); }, 5000 + Math.random() * 6000);
}
function wander() {
  if (busy || !S || $("home").hidden || $("pet").classList.contains("walking")) return;
  const st = state();
  if (st === "happy" && Math.random() < 0.35) { motion("hopping", 700); return; }
  const limit = Math.max(0, (stageBox().width - $("rig").offsetWidth) / 2 - 24);
  let to = (Math.random() * 2 - 1) * limit;
  if (Math.abs(to - petX) < 30) to = petX > 0 ? -limit * 0.6 : limit * 0.6;
  const speed = st === "idle" || st === "happy" ? 55 : 25;   // 시무룩하면 터덜터덜
  const ms = Math.abs(to - petX) / speed * 1000;
  const pet = $("pet");
  $("flip").classList.toggle("left", to < petX);
  pet.classList.add("walking");
  pet.style.transitionDuration = ms + "ms";
  pet.style.transform = `translateX(${to}px)`;
  petX = to;
  moveBubble();
  clearTimeout(walkEnd);
  walkEnd = setTimeout(() => pet.classList.remove("walking"), ms);
}
function stopWalking() {
  const pet = $("pet");
  if (!pet.classList.contains("walking")) return;
  clearTimeout(walkEnd);
  const m = new DOMMatrix(getComputedStyle(pet).transform);
  petX = m.m41;
  pet.style.transitionDuration = "0s";
  pet.style.transform = `translateX(${petX}px)`;
  pet.classList.remove("walking");
  moveBubble();
}
function moveBubble() {
  const max = Math.max(0, stageBox().width / 2 - 120);
  $("bubble").style.left = `calc(50% + ${Math.max(-max, Math.min(max, petX))}px)`;
}

function update() {
  if (!S) return;
  $("coinNum").textContent = S.coins;
  $("lv").textContent = `Lv.${S.level}`;
  $("xpBar").style.width = `${Math.min(100, (S.xp / xpNeed(S.level)) * 100)}%`;
  for (const k of Object.keys(STAT_LABEL)) {
    const g = document.querySelector(`.gauge[data-k="${k}"]`);
    if (!g) continue;
    const v = Math.round(S[k]);
    g.querySelector("i").style.width = v + "%";
    g.querySelector("em").textContent = v;
    g.classList.toggle("low", v < LOW);
  }
  const st = state();
  const sulky = st === "hungry" || st === "dirty" || st === "bored";
  $("pet").classList.toggle("sulky", sulky);
  const tag = $("moodTag");
  tag.textContent = sulky ? "시무룩" : st === "happy" ? "행복해요" : "평온해요";
  tag.classList.toggle("low", sulky);
  const washLeft = Math.ceil(((S.washAt || 0) + 30000 - Date.now()) / 1000);
  $("washSub").textContent = washLeft > 0 ? `${washLeft}초 뒤` : "+2코인";
  const danceLeft = Math.ceil(((S.danceAt || 0) + 20000 - Date.now()) / 1000);
  $("danceSub").textContent = danceLeft > 0 ? `${danceLeft}초 뒤` : "기분 +";
}

/* ---------- 말풍선 ---------- */
function say(text, ms = 3500) {
  const b = $("bubble");
  b.textContent = text; b.classList.remove("fade");
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => b.classList.add("fade"), ms);
}
function scheduleIdle() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (!busy && !$("home").hidden) say(pick(CHARS[S.kind].lines[state()]));
    scheduleIdle();
  }, 9000 + Math.random() * 7000);
}

/* ---------- 효과 ---------- */
function stageBox() { return $("stage").getBoundingClientRect(); }
function petCenter() {
  const s = stageBox(), p = $("rig").getBoundingClientRect();
  return { x: p.left - s.left + p.width / 2, y: p.top - s.top + p.height * 0.35 };
}
function spawn(cls, html, x, y, dx = 0) {
  const el = document.createElement("div");
  el.className = "fx " + cls;
  el.innerHTML = html;
  el.style.left = x + "px"; el.style.top = y + "px"; el.style.setProperty("--dx", dx + "px");
  $("stage").appendChild(el);
  setTimeout(() => el.remove(), 3000);
  return el;
}
function burst(kind, n) {
  const c = petCenter();
  for (let i = 0; i < n; i++) {
    setTimeout(() => {
      const x = c.x + (Math.random() - .5) * 120, y = c.y + Math.random() * 40;
      if (kind === "heart") spawn("heart float-up", HEART, x, y, (Math.random() - .5) * 40);
      if (kind === "soap") spawn("soap float-up", "", x, y + 40, (Math.random() - .5) * 30);
      if (kind === "note") spawn("note float-up", pick(["♪", "♫", "♬"]), x, y, (Math.random() - .5) * 60);
      if (kind === "munch") spawn("munch float-up", pick(["냠", "냠냠", "오물"]), x + 40, y - 10, 20);
    }, i * 140);
  }
}
function motion(cls, ms) {
  const p = $("pet");
  stopWalking();
  p.classList.remove("eating", "dancing", "petted", "washing", "hopping");
  void p.offsetWidth;
  p.classList.add(cls);
  return new Promise((r) => setTimeout(() => { p.classList.remove(cls); r(); }, ms));
}
function bumpCoin(delta) {
  S.coins += delta;
  const c = $("coin"); c.classList.remove("bump"); void c.offsetWidth; c.classList.add("bump");
}
function toast(msg) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}

function gainXp(n) {
  S.xp += n;
  if (S.xp >= xpNeed(S.level)) {
    S.xp -= xpNeed(S.level); S.level += 1;
    setTimeout(() => { say(pick(CHARS[S.kind].lines.levelup), 4000); dance(false, true); }, 900);
  }
}

/* ---------- 행동 ---------- */
async function feed(food) {
  closeSheets();
  if (busy) return;
  if (S.coins < food.price) { toast("코인이 부족해요. 씻기기와 쓰다듬기로 모아 보세요"); return; }
  busy = true;
  bumpCoin(-food.price);
  const isFav = CHARS[S.kind].fav === food.id;
  // 음식이 날아와서 세 입에 사라진다
  const s = stageBox(), c = petCenter();
  const el = spawn("food-fly", FOOD_ICONS[food.id], s.width - 60, 20);
  el.style.setProperty("--tx", `${c.x - (s.width - 60) - 22}px`);
  el.style.setProperty("--ty", `${c.y - 10}px`);
  await new Promise((r) => setTimeout(r, 600));
  const eat = motion("eating", 1700);
  burst("munch", 3);
  setTimeout(() => el.classList.add("bite1"), 450);
  setTimeout(() => el.classList.add("bite2"), 950);
  setTimeout(() => { el.style.opacity = "0"; }, 1400);
  await eat;
  S.full = clamp(S.full + food.full);
  S.mood = clamp(S.mood + food.mood + (isFav ? 15 : 0));
  gainXp(isFav ? 14 : 10);
  say(pick(CHARS[S.kind].lines[isFav ? "fav" : "feed"]));
  if (isFav) burst("heart", 4);
  save(); update(); busy = false;
}

async function wash() {
  if (busy) return;
  if (Date.now() < (S.washAt || 0) + 30000) { toast("방금 씻었어요. 조금 뒤에 다시 씻겨 주세요"); return; }
  busy = true;
  S.washAt = Date.now();
  burst("soap", 10);
  await motion("washing", 1450);
  S.clean = clamp(S.clean + 35);
  bumpCoin(2); gainXp(8);
  say(pick(CHARS[S.kind].lines.wash));
  save(); update(); busy = false;
}

async function pet() {
  if (busy) return;
  burst("heart", 2);
  motion("petted", 500);
  S.mood = clamp(S.mood + 6);
  const now = Date.now();
  if (now >= petCooldownUntil) { bumpCoin(1); gainXp(3); petCooldownUntil = now + 4000; }
  say(pick(CHARS[S.kind].lines.pet), 2500);
  save(); update();
}

async function dance(gain = true, force = false) {
  if (busy && !force) return;
  if (gain && Date.now() < (S.danceAt || 0) + 20000) { toast("숨 좀 고르고 다시 춤출게요"); return; }
  busy = true;
  if (gain) S.danceAt = Date.now();
  const sulky = state() !== "idle" && state() !== "happy";
  burst("note", 6);
  if (gain) say(sulky ? "...지금은 기운이 없어도 한 번 해볼게." : pick(CHARS[S.kind].lines.dance), 2700);
  await motion("dancing", 2700);
  if (gain) { S.mood = clamp(S.mood + 12); S.full = clamp(S.full - 4); gainXp(5); }
  save(); update(); busy = false;
}

/* ---------- 시트 ---------- */
function openShop() {
  const c = CHARS[S.kind];
  $("shopSub").textContent = `가진 코인 ${S.coins}개 · ${c.name}의 최애는 ${FOODS.find((f) => f.id === c.fav).name}`;
  $("menu").innerHTML = "";
  for (const f of FOODS) {
    const b = document.createElement("button");
    b.className = "food"; b.disabled = S.coins < f.price;
    const fx = [`배부름 +${f.full}`, f.mood ? `기분 +${f.mood + (c.fav === f.id ? 15 : 0)}` : (c.fav === f.id ? "기분 +15" : "")].filter(Boolean).join(" · ");
    b.innerHTML = `${FOOD_ICONS[f.id]}<b>${f.name}${c.fav === f.id ? '<span class="fav">최애</span>' : ""}</b><small>${f.price}코인 · ${fx}</small>`;
    b.onclick = () => feed(f);
    $("menu").appendChild(b);
  }
  $("shop").hidden = false;
}
function closeSheets() { $("shop").hidden = true; $("settings").hidden = true; }
document.querySelectorAll(".scrim").forEach((s) => {
  s.addEventListener("click", (e) => { if (e.target === s || e.target.hasAttribute("data-close")) closeSheets(); });
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheets(); });

/* ---------- 화면 모드 ---------- */
function applyTheme(t) {
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.dataset.theme = t;
  document.querySelectorAll("#themeSeg button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.theme === t));
}
let theme = "auto";
theme = storeGet(THEME_KEY) || "auto";
applyTheme(theme);
document.querySelectorAll("#themeSeg button").forEach((b) => b.onclick = () => {
  theme = b.dataset.theme; applyTheme(theme);
  storeSet(THEME_KEY, theme);
});

let resetArmed = false;
$("resetBtn").onclick = () => {
  if (!resetArmed) { resetArmed = true; $("resetBtn").textContent = "한 번 더 누르면 초기화"; $("resetBtn").classList.add("danger"); return; }
  resetArmed = false; $("resetBtn").textContent = "다시 입양하기"; $("resetBtn").classList.remove("danger");
  storeSet(STORE_KEY, null);
  S = null; closeSheets(); clearTimeout(idleTimer); clearTimeout(wanderTimer); renderAdopt();
};
$("openSettings").onclick = () => {
  resetArmed = false; $("resetBtn").textContent = "다시 입양하기"; $("resetBtn").classList.remove("danger");
  $("settings").hidden = false;
};

$("actFeed").onclick = openShop;
$("actWash").onclick = wash;
$("actPet").onclick = pet;
$("pet").onclick = pet;
$("actDance").onclick = () => dance(true);

/* ---------- 시작 ---------- */
if (S && CHARS[S.kind]) {
  const away = Date.now() - S.last;
  decay(Date.now()); save();
  renderHome();
  const st = state();
  if (away > 10 * 60 * 1000) say(st === "idle" || st === "happy" ? "왔구나! " + pick(CHARS[S.kind].lines.idle) : pick(CHARS[S.kind].lines[st]), 4500);
  else say(pick(CHARS[S.kind].lines[st]));
} else {
  S = null; renderAdopt();
}
setInterval(() => { if (S) { decay(Date.now()); update(); } }, 1000);
setInterval(() => { if (S) save(); }, 10000);
document.addEventListener("visibilitychange", () => { if (S) { decay(Date.now()); update(); save(); } });
</script>
</body>
</html>

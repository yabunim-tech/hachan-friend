<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내칭기칭기는 다마고치</title>
<!-- 웹으로 공개할 때 홈 화면·Dock에 추가하면 앱처럼 뜨게 하는 정보(deploy/에 아이콘과 함께 있음) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="내칭기칭기는 다마고치">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1e21" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 톤: 디자인 시스템/오늘의집_DESIGN.md — 흰 바탕, 짙은 회색 글, 파란색은 행동 버튼에만, 4px 모서리, 포커스는 그림자 링 */
:root {
  --canvas: #ffffff;
  --paper: #f7f9fa;
  --fg: #2f3438;
  --body: #424242;
  --muted: #828c94;
  --line: #e0e0e0;
  --line-soft: #eaedef;
  --action: #00a1ff;
  --action-hover: #0497ef;
  --ring: #ddf3ff;
  --low: #ff7777;        /* 게이지가 낮을 때만 */
  --shadow: 0 2px 5px rgba(63, 71, 77, 0.15);
  --sprite-filter: none;
  --sans: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #1b1e21; --paper: #131517; --fg: #eef1f3; --body: #d5d9dc; --muted: #8f99a1;
    --line: #34393d; --line-soft: #2a2e32; --ring: #0d4466; --low: #ff8a8a;
    --shadow: 0 2px 5px rgba(0, 0, 0, 0.4); --sprite-filter: invert(1); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --canvas: #1b1e21; --paper: #131517; --fg: #eef1f3; --body: #d5d9dc; --muted: #8f99a1;
  --line: #34393d; --line-soft: #2a2e32; --ring: #0d4466; --low: #ff8a8a;
  --shadow: 0 2px 5px rgba(0, 0, 0, 0.4); --sprite-filter: invert(1); color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--paper); }
body {
  color: var(--body); font-family: var(--sans); font-size: 15px; letter-spacing: -0.3px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; letter-spacing: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring); }

.app {
  max-width: 440px; min-height: 100dvh; margin: 0 auto; background: var(--canvas);
  display: flex; flex-direction: column;
  padding: max(12px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
}
header { display: flex; align-items: center; gap: 8px; height: 48px; }
header h1 { flex: 1; margin: 0; font-size: 18px; font-weight: 700; color: var(--fg); }
.icon-btn {
  width: 36px; height: 36px; border: 0; background: transparent; border-radius: 4px;
  display: grid; place-items: center; color: var(--fg);
}
.icon-btn:hover { background: var(--paper); }
.icon-btn svg { width: 20px; height: 20px; }
.coin {
  display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px;
  border: 1px solid var(--line); border-radius: 24px; font-size: 14px; font-weight: 700; color: var(--fg);
}
.coin i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--action); display: inline-block; }
.coin.bump { animation: bump .4s; }
@keyframes bump { 40% { transform: scale(1.15); } }

/* ---------- 입양 화면 ---------- */
.adopt h2 { margin: 20px 0 4px; font-size: 22px; font-weight: 700; color: var(--fg); }
.adopt p.lead { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
.picks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pick {
  border: 1px solid var(--line); background: var(--canvas); border-radius: 4px; padding: 12px 6px 10px;
  display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
}
.pick[aria-pressed="true"] { border-color: var(--action); box-shadow: 0 0 0 1px var(--action); }
.pick .thumb { height: 84px; display: grid; place-items: center; }
.pick img { max-height: 84px; max-width: 84px; filter: var(--sprite-filter); }
.pick b { font-size: 15px; color: var(--fg); }
.pick small { font-size: 12px; color: var(--muted); line-height: 1.35; }
.detail { margin: 16px 0; padding: 14px 16px; background: var(--paper); border-radius: 4px; font-size: 14px; }
.detail dl { margin: 0; display: grid; grid-template-columns: 64px 1fr; row-gap: 4px; }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; color: var(--fg); }
label.field { display: block; font-size: 14px; font-weight: 700; color: var(--fg); margin-bottom: 6px; }
.text-input {
  width: 100%; height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 4px;
  background: var(--canvas); color: var(--fg); font-size: 15px;
}
.text-input:focus { outline: none; border-color: var(--action); box-shadow: 0 0 0 3px var(--ring); }
.btn {
  height: 48px; border: 0; border-radius: 4px; padding: 0 16px; font-size: 16px; font-weight: 700;
  background: var(--action); color: #fff; width: 100%;
}
.btn:hover, .btn:active { background: var(--action-hover); }
.btn:disabled { background: var(--line); color: var(--muted); cursor: default; }
.btn.line { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn.line:hover { background: var(--paper); }
.adopt .btn { margin-top: 16px; }
.hint { margin-top: 8px; font-size: 13px; color: var(--muted); }

/* ---------- 키우기 화면 ---------- */
.who { display: flex; align-items: baseline; gap: 8px; margin-top: 8px; }
.who b { font-size: 22px; font-weight: 700; color: var(--fg); }
.who span { font-size: 14px; color: var(--muted); }
.lv { margin-left: auto; font-size: 14px; color: var(--fg); font-weight: 700; }
.xp { height: 4px; background: var(--line-soft); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.xp i { display: block; height: 100%; background: var(--action); transition: width .4s; }

.stage {
  position: relative; margin-top: 14px; height: 300px; border-radius: 4px; background: var(--paper);
  overflow: hidden; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 44px;
  user-select: none; -webkit-user-select: none;
}
.stage::after { /* 바닥 선 */
  content: ""; position: absolute; left: 24px; right: 24px; bottom: 40px; height: 1px; background: var(--line);
}
/* ---------- 캐릭터: 몸·머리는 CSS로, 팔다리는 스크립트(limbFrame)가 매 프레임 곡선으로 그린다 ----------
   머리 조각은 새싹이에게만 있다(납작이·길쭉이는 머리 선이 몸 선으로 이어져서 따로 기울이면 얼굴이 조각난다).
   새싹 줄기·잎도 스크립트가 팔다리처럼 휘게 그린다. --ha: 머리 흔들림 세기 */
.pet {
  position: relative; z-index: 2; border: 0; background: none; padding: 0;
  transition-property: transform; transition-timing-function: linear;
}
.pet[data-kind="sprout"] { --ha: .7; }
.flip { transition: transform .2s; }
.flip.left { transform: scaleX(-1); }
.rig { position: relative; transform-origin: 50% 100%; animation: breathe 3.2s ease-in-out infinite; }
.part { position: absolute; inset: 0; }
.part img { position: absolute; inset: 0; width: 100%; height: 100%; filter: var(--sprite-filter); pointer-events: none; transition: opacity .4s; }
.part svg {
  position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none;
  fill: none; stroke: #000; stroke-linecap: round; stroke-linejoin: round; filter: var(--sprite-filter); transition: opacity .4s;
}
.p-head { animation: headIdle 4.4s ease-in-out infinite; }
@keyframes breathe  { 50% { transform: scale(.985, 1.03); } }
@keyframes headIdle { 0%, 100% { transform: rotate(calc(var(--ha) * -3deg)); } 50% { transform: rotate(calc(var(--ha) * 3deg)); } }

/* 시무룩: 고개 푹, 팔 축 */
.pet.sulky .rig    { animation: sulkBody 4.5s ease-in-out infinite; }
.pet.sulky .p-head { animation: sulkHead 4.5s ease-in-out infinite; }
.pet.sulky .part img, .pet.sulky .part svg { opacity: .6; }
@keyframes sulkBody { 0%, 100% { transform: scale(1.01, .96); } 50% { transform: scale(1.02, .94); } }
@keyframes sulkHead { 0%, 100% { transform: rotate(calc(var(--ha) * 12deg)) translateY(1.5%); } 50% { transform: rotate(calc(var(--ha) * 16deg)) translateY(2.5%); } }

/* 걷기: 다리 번갈아 + 팔은 반대로 + 몸 통통 */
.pet.walking .rig    { animation: walkBob .5s ease-in-out infinite; }
.pet.walking .p-head { animation: headWalk .5s ease-in-out infinite; }
.pet.sulky.walking .rig { animation-duration: .9s; }
@keyframes walkBob  { 25%, 75% { transform: translateY(-5px); } 0%, 50%, 100% { transform: translateY(0) scaleY(.97); } }
@keyframes headWalk { 25% { transform: rotate(calc(var(--ha) * -3deg)); } 75% { transform: rotate(calc(var(--ha) * 3deg)); } }

/* 먹기: 음식 쪽으로 고개 들기 → 두 손 모아 입으로 → 오물오물 + 발 동동 */
.pet.eating .rig    { animation: eatBody 1.7s ease-in-out; }
.pet.eating .p-head { animation: eatHead 1.7s ease-in-out; }
@keyframes eatBody {
  15% { transform: translateY(-6px) scale(.98, 1.04); }
  30%, 46%, 62%, 78% { transform: scale(1.04, .93); }
  38%, 54%, 70%, 86% { transform: scale(.99, 1.02); }
}
@keyframes eatHead {
  15% { transform: rotate(calc(var(--ha) * -10deg)); }
  30%, 46%, 62%, 78% { transform: rotate(calc(var(--ha) * 7deg)) translateY(2%); }
  38%, 54%, 70%, 86% { transform: rotate(calc(var(--ha) * -2deg)); }
}

/* 춤: 좌우로 스텝 + 점프, 팔은 번갈아 머리 위로, 다리 킥 */
.pet.dancing .rig    { animation: danceBody .9s ease-in-out 3; }
.pet.dancing .p-head { animation: danceHead .45s ease-in-out 6 alternate; }
@keyframes danceBody {
  0%, 100% { transform: translate(0, 0); }
  12.5% { transform: translate(-6px, -16px) rotate(-6deg); }
  25%   { transform: translate(-9px, 0) rotate(-8deg) scale(1.04, .92); }
  37.5% { transform: translate(0, -18px); }
  50%   { transform: translate(9px, 0) rotate(8deg) scale(1.04, .92); }
  62.5% { transform: translate(6px, -14px) rotate(4deg); }
  75%   { transform: translate(0, 0) scale(1.03, .95); }
  87.5% { transform: translate(0, -24px) scale(.97, 1.05); }
}
@keyframes danceHead { from { transform: rotate(calc(var(--ha) * -13deg)); } to { transform: rotate(calc(var(--ha) * 13deg)); } }

/* 쓰다듬기: 손 쪽으로 고개 기울이고 팔 파닥 */
.pet.petted .rig    { animation: petBody .8s ease-in-out; }
.pet.petted .p-head { animation: petHead .8s ease-in-out; }
@keyframes petBody { 30% { transform: scale(1.05, .92); } 60% { transform: scale(.98, 1.04); } }
@keyframes petHead { 30% { transform: rotate(calc(var(--ha) * 11deg)); } 60% { transform: rotate(calc(var(--ha) * -4deg)); } }

/* 씻기: 몸 부르르 + 두 팔로 박박 + 고개 도리도리 */
.pet.washing .rig    { animation: shake .18s linear 8; }
.pet.washing .p-head { animation: headShake .36s ease-in-out 4; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@keyframes headShake { 25% { transform: rotate(calc(var(--ha) * -7deg)); } 75% { transform: rotate(calc(var(--ha) * 7deg)); } }

/* 기분 좋을 때 가끔: 만세 점프 */
.pet.hopping .rig    { animation: hop .7s ease-out; }
@keyframes hop { 15% { transform: scale(1.06, .9); } 45% { transform: translateY(-30px) scale(.96, 1.06); } 75% { transform: scale(1.05, .93); } }

.bubble {
  position: absolute; left: 50%; transition: left .4s, opacity .25s; top: 14px; transform: translateX(-50%); z-index: 3;
  max-width: calc(100% - 32px); width: max-content; padding: 10px 14px; border-radius: 4px;
  background: var(--canvas); color: var(--fg); box-shadow: var(--shadow); font-size: 15px; line-height: 1.45; text-align: center;

}
.bubble::after {
  content: ""; position: absolute; left: 50%; bottom: -6px; width: 12px; height: 12px; margin-left: -6px;
  background: var(--canvas); transform: rotate(45deg); box-shadow: 3px 3px 4px rgba(63,71,77,.08);
}
.bubble.fade { opacity: 0; }
.mood-tag {
  position: absolute; left: 12px; bottom: 10px; z-index: 3; font-size: 13px; color: var(--muted);
}
.mood-tag.low { color: var(--low); font-weight: 700; }

/* 방: 가구는 캐릭터 뒤(z-index 1), 캐릭터와 같은 손그림 선으로 그린다 */
.room { position: absolute; inset: 0; z-index: 1; pointer-events: none; color: var(--fg); }
.room .d { position: absolute; }
.room .d.pop { animation: place .4s cubic-bezier(.3,.7,.4,1.3); }
@keyframes place { from { opacity: 0; transform: translateY(-10px) scale(.92); } }
.decor-svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.decor-svg .fill { fill: var(--canvas); }
.decor-svg .dot { fill: currentColor; stroke: none; }
.decor-svg .thin { stroke-width: 1.5; }
.d-window   { left: 30px; top: 40px; width: 100px; height: 100px; }
.d-curtain  { left: 16px; top: 30px; width: 128px; height: 116px; }
.d-frame    { right: 128px; top: 36px; width: 64px; height: 52px; }
.d-lamp     { right: 44px; bottom: 182px; width: 40px; height: 60px; }   /* 책장 위 */
.d-plant    { left: 20px; bottom: 40px; width: 56px; height: 84px; }
.d-bookshelf, .d-books { right: 26px; bottom: 40px; width: 84px; height: 144px; }
.d-vase     { left: 40px; bottom: 40px; width: 40px; height: 56px; }
.room.has-window .d-vase { left: 60px; bottom: 162px; }   /* 창문이 있으면 창틀 위에 */
.room.has-plant:not(.has-window) .d-vase { left: 84px; }   /* 바닥에선 화분 옆으로 비켜 선다 */
.d-rug      { left: 50%; bottom: 24px; width: 240px; height: 30px; margin-left: -120px; }
.food .decor-svg { grid-row: span 2; width: 40px; height: 40px; color: var(--fg); }

/* 날아가는 음식, 하트, 비눗방울, 음표 */
.fx { position: absolute; z-index: 4; pointer-events: none; color: var(--fg); }
.fx svg { width: 100%; height: 100%; display: block; }
.food-fly { width: 44px; height: 44px; transition: opacity .3s; animation: fly .55s cubic-bezier(.3,.7,.4,1) forwards; }
@keyframes fly { from { transform: translate(0, 0) scale(.6); } to { transform: translate(var(--tx), var(--ty)) scale(1); } }
.food-fly.bite1 { clip-path: circle(42% at 40% 55%); }
.food-fly.bite2 { clip-path: circle(28% at 35% 60%); }
.float-up { animation: floatUp 1.2s ease-out forwards; }
@keyframes floatUp { from { opacity: 1; transform: translate(0,0) scale(.8); } to { opacity: 0; transform: translate(var(--dx, 0px), -90px) scale(1.1); } }
.note { font-size: 22px; font-weight: 700; color: var(--action); }
.heart { width: 22px; height: 22px; color: var(--low); }
.soap { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--action); opacity: .8; }
.munch { font-size: 14px; font-weight: 700; color: var(--fg); }
.cure { font-size: 24px; font-weight: 700; color: var(--low); }

.gauges { margin-top: 16px; display: grid; gap: 10px; }
.gauge { display: grid; grid-template-columns: 52px 1fr 34px; align-items: center; gap: 10px; font-size: 14px; }
.gauge span { color: var(--fg); }
.gauge .bar { height: 8px; background: var(--line-soft); border-radius: 4px; overflow: hidden; }
.gauge .bar i { display: block; height: 100%; background: var(--fg); border-radius: 4px; transition: width .5s, background .3s; }
.gauge.low .bar i { background: var(--low); }
.gauge em { font-style: normal; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.gauge.low em { color: var(--low); font-weight: 700; }

.actions { margin-top: 18px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.act {
  border: 1px solid var(--line); background: var(--canvas); border-radius: 4px; height: 76px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--fg);
}
.act:hover { background: var(--paper); }
.act svg { width: 26px; height: 26px; }
.act b { font-size: 13px; font-weight: 700; white-space: nowrap; }
.act small { font-size: 11px; color: var(--muted); line-height: 1; }
.act:disabled { color: var(--muted); cursor: default; background: var(--canvas); }
.act:disabled svg { opacity: .4; }
.footnote { margin-top: 14px; text-align: center; font-size: 12px; color: var(--muted); }

/* 텃밭: 실제 시간으로 자라고, 다 자라면 눌러서 거둔다 */
/* 방 아래 '다음 단계'로 들어가는 줄(방 꾸미기·텃밭) */
.nav-rows { margin-top: 16px; display: grid; gap: 8px; }
.nav-row {
  display: flex; align-items: center; gap: 12px; width: 100%; height: 60px; padding: 0 12px 0 14px;
  border: 1px solid var(--line); border-radius: 4px; background: var(--canvas); color: var(--fg); text-align: left;
}
.nav-row:hover { background: var(--paper); }
.nav-row > svg { width: 26px; height: 26px; flex: none; }
.nav-row span { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.nav-row b { font-size: 15px; font-weight: 700; }
.nav-row small { font-size: 12px; color: var(--muted); }
.nav-row small.ready { color: var(--action); font-weight: 700; }
.nav-row .chev { width: 18px; height: 18px; color: var(--muted); }
.page-head { display: flex; align-items: center; gap: 4px; margin: 8px 0 4px; }
.page-head b { flex: 1; font-size: 20px; font-weight: 700; color: var(--fg); }
.page-head .icon-btn { margin-left: -8px; }
.page-hint { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.plots { margin: 14px 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.plot {
  position: relative; height: 84px; border: 1px dashed var(--line); border-radius: 4px; background: var(--canvas);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0 2px 6px;
  font-size: 11px; color: var(--muted); line-height: 1; white-space: nowrap;
}
.plot:hover { background: var(--paper); }
.plot svg { width: 28px; height: 28px; color: var(--fg); }
.plot .prog { position: absolute; left: 6px; right: 6px; bottom: 6px; height: 3px; background: var(--line-soft); border-radius: 2px; overflow: hidden; }
.plot .prog i { display: block; height: 100%; background: var(--action); transition: width .5s; }
.plot.growing { border-style: solid; }
.plot.ready { border: 1px solid var(--action); box-shadow: 0 0 0 1px var(--action); color: var(--action); font-weight: 700; }
.plot.ready svg { animation: ripe 1.6s ease-in-out infinite; }
@keyframes ripe { 50% { transform: translateY(-3px) rotate(-6deg); } }
.plot.withered { border-style: solid; color: var(--low); font-weight: 700; }
.plot.withered svg { opacity: .45; transform: rotate(14deg); }
.plot.locked { background: var(--paper); border: 1px solid var(--line-soft); cursor: default; }
.plot.locked svg { width: 18px; height: 18px; color: var(--muted); }
.barn-btn {
  height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: 24px; background: var(--canvas);
  font-size: 13px; font-weight: 700; color: var(--fg);
}
.barn-btn:hover { background: var(--paper); }
.barn-list { display: grid; gap: 8px; }
.barn-row {
  display: grid; grid-template-columns: 40px 1fr auto auto; align-items: center; gap: 8px;
  padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px;
}
.barn-row svg { width: 36px; height: 36px; color: var(--fg); }
.barn-row b { display: flex; align-items: center; gap: 6px; font-size: 15px; color: var(--fg); }
.barn-row small { display: block; font-size: 12px; color: var(--muted); }
.barn-row .fav { font-size: 11px; font-weight: 700; color: var(--action); }
.barn-row button { height: 36px; padding: 0 12px; border-radius: 4px; font-size: 14px; font-weight: 700; }
.barn-row .eat { border: 1px solid var(--line); background: var(--canvas); color: var(--fg); }
.barn-row .sell { border: 0; background: var(--action); color: #fff; }
.barn-row .sell:hover { background: var(--action-hover); }
.barn-empty { margin: 8px 0; padding: 20px 12px; text-align: center; font-size: 14px; color: var(--muted); background: var(--paper); border-radius: 4px; }

/* 아래에서 올라오는 시트(음식 가게·설정) */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 440px; background: var(--canvas); border-radius: 12px 12px 0 0;
  padding: 18px 16px max(16px, env(safe-area-inset-bottom)); animation: up .22s ease-out;
}
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sheet h3 { margin: 0 0 4px; font-size: 18px; font-weight: 700; color: var(--fg); }
.sheet .sub { margin: 0 0 14px; font-size: 13px; color: var(--muted); }
.menu { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.food {
  border: 1px solid var(--line); background: var(--canvas); border-radius: 4px; padding: 12px;
  display: grid; grid-template-columns: 40px 1fr; grid-template-rows: auto auto; column-gap: 10px; text-align: left; align-items: center;
}
.food:hover { background: var(--paper); }
.food svg { grid-row: span 2; width: 40px; height: 40px; color: var(--fg); }
.food b { font-size: 15px; color: var(--fg); display: flex; align-items: center; gap: 6px; }
.food small { font-size: 12px; color: var(--muted); }
.food .fav { font-size: 11px; font-weight: 700; color: var(--action); }
.food:disabled { opacity: .45; cursor: default; }
.sheet .btn.line { margin-top: 12px; }
.row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line-soft); font-size: 15px; color: var(--fg); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; background: transparent; height: 32px; padding: 0 12px; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--action); color: #fff; }
.danger { color: var(--low); }

.toast {
  position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 30;
  background: var(--fg); color: var(--canvas); padding: 10px 16px; border-radius: 4px; font-size: 14px;
  animation: up .2s ease-out;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>내칭기칭기는 다마고치</h1>
    <span class="coin" id="coin" hidden><i></i><span id="coinNum">0</span></span>
    <button class="icon-btn" id="openSettings" aria-label="설정">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </header>

  <!-- 입양 -->
  <section class="adopt" id="adopt" hidden>
    <h2>어떤 친구를 데려갈까요?</h2>
    <p class="lead">하찮지만 소중한 친구를 골라 이름을 지어 주세요.</p>
    <div class="picks" id="picks"></div>
    <div class="detail" id="pickDetail"></div>
    <label class="field" for="nameInput">이름</label>
    <input class="text-input" id="nameInput" maxlength="8" placeholder="최대 8자" autocomplete="off">
    <button class="btn" id="adoptBtn" disabled>입양하기</button>
    <p class="hint">시작 코인 30개를 드려요. 텃밭에서 거둔 작물을 팔아 코인을 벌어요. 게이지가 아주 낮아지면 아플 수 있지만 떠나지는 않아요. 치료하기로 금방 나아요.</p>
  </section>

  <!-- 키우기 -->
  <section id="home" hidden>
    <div class="who"><b id="petName"></b><span id="petKind"></span><span class="lv" id="lv"></span></div>
    <div class="xp"><i id="xpBar"></i></div>
    <div class="stage" id="stage">
      <div class="room" id="room"></div>
      <div class="bubble" id="bubble"></div>
      <button class="pet" id="pet" aria-label="쓰다듬기"><div class="flip" id="flip"><div class="rig" id="rig"></div></div></button>
      <span class="mood-tag" id="moodTag"></span>
    </div>
    <div class="gauges" id="gauges"></div>
    <div class="actions">
      <button class="act" id="actFeed"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15h22a11 11 0 0 1-22 0Z"/><path d="M12 26h8M11 10c0-2 2-2 2-4M17 10c0-2 2-2 2-4"/></svg><b>밥 주기</b><small>코인 사용</small></button>
      <button class="act" id="actWash"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="19" r="6"/><circle cx="21" cy="12" r="4"/><circle cx="22" cy="23" r="3"/></svg><b>씻기기</b><small id="washSub">+2코인</small></button>
      <button class="act" id="actPet"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M16 26s-10-6-10-13a5.5 5.5 0 0 1 10-3 5.5 5.5 0 0 1 10 3c0 7-10 13-10 13Z"/></svg><b>쓰다듬기</b><small id="petSub">+1코인</small></button>
      <button class="act" id="actDance"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 24V8l14-3v16"/><circle cx="9" cy="24" r="3"/><circle cx="23" cy="21" r="3"/></svg><b>춤추기</b><small id="danceSub">기분 +</small></button>
      <button class="act" id="actHeal"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="22" height="16" rx="3"/><path d="M12 10V7h8v3M16 14v8M12 18h8"/></svg><b>치료하기</b><small id="healSub">건강해요</small></button>
    </div>
    <div class="nav-rows">
      <button class="nav-row" id="openDecor"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17V12a3 3 0 0 1 3-3h14a3 3 0 0 1 3 3v5"/><path d="M4 17a2 2 0 0 1 4 0v3h16v-3a2 2 0 0 1 4 0v6H4Z"/><path d="M7 23v3M25 23v3"/></svg><span><b>방 꾸미기</b><small id="decorSub"></small></span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="nav-row" id="openGarden"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 27V15"/><path d="M16 17c-1-6-6-9-11-8 0 6 5 9 11 8Z"/><path d="M16 15c1-5 5-8 10-7 0 5-4 8-10 7Z"/><path d="M8 27h16"/></svg><span><b>텃밭</b><small id="gardenSub"></small></span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <p class="footnote">친구를 직접 눌러도 쓰다듬을 수 있어요</p>
  </section>

  <!-- 텃밭(방에서 한 단계 안) -->
  <section id="gardenPage" hidden>
    <div class="page-head">
      <button class="icon-btn" id="gardenBack" aria-label="방으로 돌아가기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <b>텃밭</b>
      <button class="barn-btn" id="openBarn">창고</button>
    </div>
    <p class="page-hint">씨앗을 심으면 앱을 닫아도 자라요. 거둔 작물은 창고에서 팔거나 먹여요.</p>
    <div class="plots" id="plots"></div>
    <p class="page-hint" id="hotLine"></p>
  </section>
</div>

<!-- 방 꾸미기 -->
<div class="scrim" id="decor" hidden>
  <div class="sheet" role="dialog" aria-label="방 꾸미기">
    <h3>방 꾸미기</h3>
    <p class="sub" id="decorSheetSub"></p>
    <div class="menu" id="decorMenu"></div>
    <button class="btn line" data-close>닫기</button>
  </div>
</div>

<!-- 창고: 거둔 작물을 팔거나 먹인다 -->
<div class="scrim" id="barn" hidden>
  <div class="sheet" role="dialog" aria-label="창고">
    <h3>창고</h3>
    <p class="sub" id="barnSub"></p>
    <div class="barn-list" id="barnList"></div>
    <button class="btn line" data-close>닫기</button>
  </div>
</div>

<!-- 씨앗 가게 -->
<div class="scrim" id="seeds" hidden>
  <div class="sheet" role="dialog" aria-label="씨앗 고르기">
    <h3>무엇을 심을까요?</h3>
    <p class="sub" id="seedsSub"></p>
    <div class="menu" id="seedMenu"></div>
    <button class="btn line" data-close>닫기</button>
  </div>
</div>

<!-- 음식 가게 -->
<div class="scrim" id="shop" hidden>
  <div class="sheet" role="dialog" aria-label="음식 고르기">
    <h3>무엇을 먹일까요?</h3>
    <p class="sub" id="shopSub"></p>
    <div class="menu" id="menu"></div>
    <button class="btn line" data-close>닫기</button>
  </div>
</div>

<!-- 설정 -->
<div class="scrim" id="settings" hidden>
  <div class="sheet" role="dialog" aria-label="설정">
    <h3>설정</h3>
    <div class="row">화면 모드
      <div class="seg" id="themeSeg">
        <button data-theme="auto">자동</button><button data-theme="light">라이트</button><button data-theme="dark">다크</button>
      </div>
    </div>
    <div class="row" id="resetRow">처음부터 다시 입양 <button class="btn line" id="resetBtn" style="width:auto;height:36px;margin:0;font-size:14px">다시 입양하기</button></div>
    <button class="btn line" data-close>닫기</button>
  </div>
</div>

// 맥 앱에서는 앱 옆 파일에, 브라우저에서는 localStorage에 저장한다.
// (함수로 둔다: 맨 위에서 load()가 먼저 불리기 때문)
function native() { return window.__hachanStore && window.webkit?.messageHandlers?.store; }
function storeGet(key) {
  if (native()) return window.__hachanStore[key] ?? null;
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function storeSet(key, value) {
  if (native()) { window.__hachanStore[key] = value; native().postMessage(JSON.stringify(window.__hachanStore)); return; }
  try { value === null ? localStorage.removeItem(key) : localStorage.setItem(key, value); } catch (e) {}
}
function load() {
  let s = null;
  try { s = JSON.parse(storeGet(STORE_KEY)) || null; } catch (e) {}
  if (s) {   // 텃밭·창고 이전 저장본 맞추기
    s.garden ||= []; s.barn ||= {}; s.decor ||= {};
    if (s.pantry) {   // 예전 '보관 음식'은 창고로: 딸기는 딸기, 쿠키는 밀로
      s.barn.strawberry = (s.barn.strawberry || 0) + (s.pantry.strawberry || 0);
      s.barn.wheat = (s.barn.wheat || 0) + (s.pantry.cookie || 0);
      delete s.pantry;
    }
  }
  return s;
}
function save() { storeSet(STORE_KEY, JSON.stringify(S)); }
const clamp = (v) => Math.max(0, Math.min(100, v));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
// 받침 있으면 a, 없으면 b: josa("창문", "을", "를") → "창문을"
const josa = (w, a, b) => w + ((w.charCodeAt(w.length - 1) - 0xac00) % 28 ? a : b);
const xpNeed = (lv) => 40 + lv * 20;

// 지난 시간만큼 게이지를 줄인다(자리 비운 시간은 최대 4시간까지)
function decay(now) {
  const dt = Math.min(now - S.last, OFFLINE_CAP);
  S.last = now;
  if (dt <= 0) return;
  const hours = dt / 3600000;
  const weak = CHARS[S.kind].weak;
  for (const k of Object.keys(BASE_DECAY)) {
    const cozy = k === "mood" ? 1 - DECOR_COZY * decorCount() : 1;   // 아늑한 방에선 기분이 천천히 준다
    S[k] = clamp(S[k] - BASE_DECAY[k] * (k === weak ? 1.4 : 1) * cozy * (S.sick ? SICK_DECAY : 1) * hours);
  }
  if (!S.sick && Object.keys(BASE_DECAY).some((k) => S[k] <= SICK_AT)) {
    S.sick = true;
    if (!$("home").hidden) setTimeout(() => say(pick(CHARS[S.kind].lines.sick), 4000), 0);
  }
}

function state() {
  if (S.sick) return "sick";
  if (S.full < LOW) return "hungry";
  if (S.clean < LOW) return "dirty";
  if (S.mood < LOW) return "bored";
  if (S.full >= HAPPY && S.mood >= HAPPY && S.clean >= HAPPY) return "happy";
  return "idle";
}

// 조각들을 원래 그림과 같은 크기로 겹쳐 쌓고, 관절 위치를 회전 중심으로 잡는다. 새싹은 머리에 붙여 같이 움직인다.
// 팔다리는 그림 대신 휘는 곡선 하나로 그리고, limbFrame이 매 프레임 모양을 바꾼다.
let LIMBS = [];
function buildRig(kind) {
  const r = RIG[kind], size = RIG_SIZE[kind], rig = $("rig");
  const w = size.w || size.h * r.w / r.h, h = size.h || size.w * r.h / r.w;
  rig.style.width = w + "px"; rig.style.height = h + "px";
  rig.innerHTML = "";
  const make = (name) => {
    const d = document.createElement("div");
    d.className = "part p-" + name;
    const [ox, oy] = r.joints[name];
    d.style.transformOrigin = `${ox}% ${oy}%`;
    d.innerHTML = `<img alt="" src="${r.parts[name]}">`;
    return d;
  };
  // 다리는 몸 뒤, 팔은 몸 앞에 그린다
  const limbLayer = (names) => {
    const d = document.createElement("div");
    d.className = "part";
    d.innerHTML = `<svg viewBox="0 0 ${r.w} ${r.h}" stroke-width="${r.stroke}">${names.map(() => "<path/>").join("")}</svg>`;
    names.forEach((name, i) => {
      const [[ax, ay], [hx, hy]] = r.limbs[name];
      LIMBS.push({ name, side: name.endsWith("L") ? 1 : -1, ax, ay, len: Math.hypot(hx - ax, hy - ay),
        base: Math.atan2(hy - ay, hx - ax), path: d.querySelectorAll("path")[i], lift: 0, bend: 0 });
    });
    return d;
  };
  LIMBS = [];
  rig.appendChild(limbLayer(["legL", "legR"]));
  rig.appendChild(make("body"));
  rig.appendChild(limbLayer(["armL", "armR"]));
  // 새싹이만 머리 조각이 있다. 새싹은 줄기(휘는 곡선) 끝에 잎 조각을 붙여 머리와 함께 움직인다
  if (r.parts.head) {
    const head = make("head");
    if (r.stem) {
      const [[bx, by], [tx, ty]] = r.stem;
      const stem = document.createElement("div");
      stem.className = "part";
      stem.innerHTML = `<svg viewBox="0 0 ${r.w} ${r.h}" stroke-width="${r.stroke}"><path/></svg>`;
      const leaf = make("leaf");
      LIMBS.push({ name: "stem", side: 1, ax: bx, ay: by, len: Math.hypot(tx - bx, ty - by), base: Math.atan2(ty - by, tx - bx),
        path: stem.querySelector("path"), lift: 0, bend: 0, leaf, tip: [tx, ty], w: r.w, h: r.h });
      head.append(stem, leaf);
    }
    rig.appendChild(head);
  }
  $("pet").dataset.kind = kind;
  petX = 0; $("pet").style.transitionDuration = "0s"; $("pet").style.transform = ""; $("flip").classList.remove("left");
  $("bubble").style.left = "50%";
}

/* ---------- 팔다리: 휘는 곡선 ----------
   lift: 어깨(엉덩이)에서 바깥·위로 드는 각도, bend: 팔 전체가 휘는 정도(+면 손끝이 위로 말림). 둘 다 도(°).
   동작마다 목표 자세를 시간 함수로 정하고, 지금 자세가 목표를 부드럽게 따라가게 해서 동작이 바뀔 때도 툭 끊기지 않는다. */
const MOTIONS = ["eating", "dancing", "washing", "petted", "hopping", "walking"];
const wave = (t, period, phase = 0) => Math.sin(2 * Math.PI * t / period + phase);
// 새싹 줄기: 바람에 살랑이듯 좌우로 흔들리고, 끝이 한 박자 늦게 따라 휜다(lift +면 오른쪽)
function stemPose(motion, t, sulky) {
  switch (motion) {
    case "walking": { const p = sulky ? .9 : .5; return { lift: 10 * wave(t, p), bend: 14 * wave(t, p, -1) }; }
    case "eating":  return { lift: 6 * wave(t, .3), bend: 9 * wave(t, .3, -1) };
    case "dancing": return { lift: 24 * wave(t, .9), bend: 30 * wave(t, .9, -1.1) };
    case "petted":  return { lift: 12 * wave(t, .4), bend: 16 * wave(t, .4, -1) };
    case "washing": return { lift: 8 * wave(t, .18), bend: 10 * wave(t, .18, -1) };
    case "hopping": { const e = Math.sin(Math.PI * Math.min(t / .7, 1)); return { lift: 4 * e, bend: 14 * e * wave(t, .2) }; }
  }
  if (sulky) return { lift: 36 + 3 * wave(t, 4.5), bend: 40 };   // 시들어 옆으로 축 처짐
  return { lift: 8 * wave(t, 2.6), bend: 12 * wave(t, 2.6, -.9) };
}
function limbPose(motion, t, limb, sulky) {
  if (limb.name === "stem") return stemPose(motion, t, sulky);
  const arm = limb.name.startsWith("arm"), L = limb.side > 0, o = L ? 1 : -1;   // o: 왼쪽·오른쪽 엇갈림
  switch (motion) {
    case "walking": {
      const p = sulky ? .9 : .5;
      return arm ? { lift: 6 + 20 * o * wave(t, p), bend: 18 + 14 * o * wave(t, p, -1) }
                 : { lift: 14 * o * wave(t, p), bend: 11 + 11 * o * wave(t, p, 1.2) };
    }
    case "eating":
      return arm ? { lift: 62 + 6 * wave(t, .38), bend: 75 + 15 * wave(t, .38, .6) }
                 : { lift: 8 * o * wave(t, .34), bend: 6 };
    case "dancing":
      return arm ? { lift: 55 + 45 * o * wave(t, .9), bend: 35 * o * wave(t, .45) }
                 : { lift: 20 * o * wave(t, .9), bend: 10 + 10 * wave(t, .45, Math.PI / 2) };
    case "petted":
      return arm ? { lift: 32 - 18 * wave(t, .4, Math.PI / 2), bend: 38 - 22 * wave(t, .4, Math.PI / 2 - .8) } : { lift: 0, bend: 6 };
    case "washing":
      return arm ? { lift: 45 + 15 * o * wave(t, .18), bend: 60 + 25 * o * wave(t, .18, -.7) }
                 : { lift: 6 * o * wave(t, .36), bend: 6 };
    case "hopping": {
      const e = Math.sin(Math.PI * Math.min(t / .7, 1));
      return arm ? { lift: 110 * e, bend: 20 * e } : { lift: 10 * e, bend: 30 * e };
    }
  }
  if (sulky) return arm ? { lift: -22 + 3 * wave(t, 4.5), bend: -18 } : { lift: 0, bend: 8 };
  return arm ? { lift: 4 + 7 * wave(t, 3.2), bend: 14 + 10 * wave(t, 3.2, -.9) } : { lift: 0, bend: 4 * wave(t, 3.2) };
}
// 길이 len인 원호를 3차 베지어로 그린다. 시작점(어깨)은 고정, 현(어깨→손) 방향은 base+lift, 휘는 양은 bend.
// 팔 높이 한계(바깥 수평 기준, 위 +). 한계 가까이에서는 점점 느려지며 멈춘다(딱 막히지 않게).
// 팔이 몸·머리 쪽으로 넘어가 선이 겹치면 엉켜서 잘린 것처럼 보이기 때문
const ARM_UP = 55, ARM_DOWN = -80, SOFT = 25;
function softLimit(v, lo, hi) {
  const sat = (x, edge) => edge + SOFT * Math.tanh((x - edge) / SOFT);
  if (v > hi - SOFT) return sat(v, hi - SOFT);
  if (v < lo + SOFT) return sat(v, lo + SOFT);
  return v;
}
function limbPath(l) {
  let a = l.base + l.side * l.lift * Math.PI / 180;
  const th = l.side * l.bend * Math.PI / 180;
  if (l.name.startsWith("arm")) {
    const ox = -l.side;   // 바깥쪽 x 방향(왼팔은 왼쪽)
    const up = softLimit(Math.atan2(-Math.sin(a), Math.cos(a) * ox) * 180 / Math.PI, ARM_DOWN, ARM_UP) * Math.PI / 180;
    a = Math.atan2(-Math.sin(up), ox * Math.cos(up));
  }
  const half = Math.abs(th) / 2;
  const chord = half < 1e-4 ? l.len : l.len * Math.sin(half) / half;
  const k = Math.abs(th) < 1e-4 ? l.len / 3 : (4 / 3) * Math.tan(Math.abs(th) / 4) * l.len / Math.abs(th);
  const t0 = a - th / 2, t1 = a + th / 2;
  const ex = l.ax + chord * Math.cos(a), ey = l.ay + chord * Math.sin(a);
  const f = (v) => v.toFixed(2);
  return { ex, ey, t1,
    d: `M${f(l.ax)} ${f(l.ay)}C${f(l.ax + k * Math.cos(t0))} ${f(l.ay + k * Math.sin(t0))} ${f(ex - k * Math.cos(t1))} ${f(ey - k * Math.sin(t1))} ${f(ex)} ${f(ey)}` };
}
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
let limbMotion = "", limbT0 = 0, limbLast = 0;
function limbFrame(now) {
  requestAnimationFrame(limbFrame);
  if (!LIMBS.length || $("home").hidden) { limbLast = now; return; }
  const pet = $("pet"), sulky = pet.classList.contains("sulky");
  const m = MOTIONS.find((c) => pet.classList.contains(c)) || "";
  if (m !== limbMotion) { limbMotion = m; limbT0 = now; }
  const dt = Math.max(0, Math.min(.1, (now - limbLast) / 1000)); limbLast = now;
  const t = reduceMotion.matches ? 0 : (m ? now - limbT0 : now) / 1000;
  const follow = 1 - Math.exp(-dt * 18);
  for (const l of LIMBS) {
    const p = limbPose(m, t, l, sulky);
    l.lift += (p.lift - l.lift) * follow;
    l.bend += (p.bend - l.bend) * follow;
    const g = limbPath(l);
    l.path.setAttribute("d", g.d);
    if (l.leaf) {   // 잎은 줄기 끝으로 옮기고 끝의 방향만큼 돌린다(회전 중심 = 원래 줄기 끝)
      const rot = (g.t1 - l.base) * 180 / Math.PI;
      l.leaf.style.transform = `translate(${(g.ex - l.tip[0]) / l.w * 100}%, ${(g.ey - l.tip[1]) / l.h * 100}%) rotate(${rot.toFixed(2)}deg)`;
    }
  }
}
requestAnimationFrame(limbFrame);

// 가끔 무대 위를 걸어 다닌다. 기분 좋으면 만세 점프도 한다.
let petX = 0, wanderTimer = 0, walkEnd = 0;
function scheduleWander() {
  clearTimeout(wanderTimer);
  wanderTimer = setTimeout(() => { wander(); scheduleWander(); }, 5000 + Math.random() * 6000);
}
function wander() {
  if (busy || !S || $("home").hidden || $("pet").classList.contains("walking")) return;
  const st = state();
  if (st === "happy" && Math.random() < 0.35) { motion("hopping", 700); return; }
  const limit = Math.max(0, (stageBox().width - $("rig").offsetWidth) / 2 - 24);
  let to = (Math.random() * 2 - 1) * limit;
  if (Math.abs(to - petX) < 30) to = petX > 0 ? -limit * 0.6 : limit * 0.6;
  const speed = st === "idle" || st === "happy" ? 55 : 25;   // 시무룩하면 터덜터덜
  const ms = Math.abs(to - petX) / speed * 1000;
  const pet = $("pet");
  $("flip").classList.toggle("left", to < petX);
  pet.classList.add("walking");
  pet.style.transitionDuration = ms + "ms";
  pet.style.transform = `translateX(${to}px)`;
  petX = to;
  moveBubble();
  clearTimeout(walkEnd);
  walkEnd = setTimeout(() => pet.classList.remove("walking"), ms);
}
function stopWalking() {
  const pet = $("pet");
  if (!pet.classList.contains("walking")) return;
  clearTimeout(walkEnd);
  const m = new DOMMatrix(getComputedStyle(pet).transform);
  petX = m.m41;
  pet.style.transitionDuration = "0s";
  pet.style.transform = `translateX(${petX}px)`;
  pet.classList.remove("walking");
  moveBubble();
}
function moveBubble() {
  const max = Math.max(0, stageBox().width / 2 - 120);
  $("bubble").style.left = `calc(50% + ${Math.max(-max, Math.min(max, petX))}px)`;
}

function update() {
  if (!S) return;
  $("coinNum").textContent = S.coins;
  $("lv").textContent = `Lv.${S.level}`;
  $("xpBar").style.width = `${Math.min(100, (S.xp / xpNeed(S.level)) * 100)}%`;
  for (const k of Object.keys(STAT_LABEL)) {
    const g = document.querySelector(`.gauge[data-k="${k}"]`);
    if (!g) continue;
    const v = Math.round(S[k]);
    g.querySelector("i").style.width = v + "%";
    g.querySelector("em").textContent = v;
    g.classList.toggle("low", v < LOW);
  }
  const st = state();
  const sulky = ["hungry", "dirty", "bored", "sick"].includes(st);
  $("pet").classList.toggle("sulky", sulky);
  const tag = $("moodTag");
  tag.textContent = st === "sick" ? "아파요" : sulky ? "시무룩" : st === "happy" ? "행복해요" : "평온해요";
  tag.classList.toggle("low", sulky);
  const needHeal = healNeeded();
  $("actHeal").disabled = !needHeal;
  $("healSub").textContent = needHeal ? `${HEAL_PRICE}코인` : "건강해요";
  const washLeft = Math.ceil(((S.washAt || 0) + 30000 - Date.now()) / 1000);
  $("washSub").textContent = washLeft > 0 ? `${washLeft}초 뒤` : handLeft() > 0 ? "+2코인" : "청결 +";
  $("petSub").textContent = handLeft() > 0 ? "+1코인" : "기분 +";
  const stored = Object.values(S.barn).reduce((a, b) => a + b, 0);
  $("openBarn").textContent = stored ? `창고 ${stored}개` : "창고";
  const now = Date.now(), open = S.garden.slice(0, plotsOpen(S.level));
  const ripe = open.filter((p) => ["ready", "withered"].includes(plotState(p, now))).length;
  const growing = open.filter((p) => plotState(p, now) === "growing").length;
  const gs = $("gardenSub");
  gs.textContent = ripe ? `거둘 수 있는 칸이 ${ripe}개 있어요` : growing ? `${growing}칸 자라는 중${stored ? ` · 창고 ${stored}개` : ""}` : stored ? `창고에 ${stored}개 · 씨앗을 심어 보세요` : "씨앗을 심어 코인을 벌어요";
  gs.classList.toggle("ready", ripe > 0);
  const n = decorCount();
  $("decorSub").textContent = n ? `가구 ${n}개 · 기분이 ${Math.round(n * DECOR_COZY * 100)}% 천천히 줄어요` : "코인으로 가구를 사서 방을 꾸며요";
  $("hotLine").textContent = `오늘의 시세: ${josa(CROPS[hotCrop()].name, "이", "가")} ${HOT_RATE}배 값에 팔려요`;
  gardenTick();
  const danceLeft = Math.ceil(((S.danceAt || 0) + 20000 - Date.now()) / 1000);
  $("danceSub").textContent = danceLeft > 0 ? `${danceLeft}초 뒤` : "기분 +";
}

/* ---------- 말풍선 ---------- */
function say(text, ms = 3500) {
  const b = $("bubble");
  b.textContent = text; b.classList.remove("fade");
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => b.classList.add("fade"), ms);
}
function scheduleIdle() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (!busy && !$("home").hidden) say(pick(CHARS[S.kind].lines[state()]));
    scheduleIdle();
  }, 9000 + Math.random() * 7000);
}

/* ---------- 효과 ---------- */
function stageBox() { return $("stage").getBoundingClientRect(); }
function petCenter() {
  const s = stageBox(), p = $("rig").getBoundingClientRect();
  return { x: p.left - s.left + p.width / 2, y: p.top - s.top + p.height * 0.35 };
}
function spawn(cls, html, x, y, dx = 0) {
  const el = document.createElement("div");
  el.className = "fx " + cls;
  el.innerHTML = html;
  el.style.left = x + "px"; el.style.top = y + "px"; el.style.setProperty("--dx", dx + "px");
  $("stage").appendChild(el);
  setTimeout(() => el.remove(), 3000);
  return el;
}
function burst(kind, n) {
  const c = petCenter();
  for (let i = 0; i < n; i++) {
    setTimeout(() => {
      const x = c.x + (Math.random() - .5) * 120, y = c.y + Math.random() * 40;
      if (kind === "heart") spawn("heart float-up", HEART, x, y, (Math.random() - .5) * 40);
      if (kind === "soap") spawn("soap float-up", "", x, y + 40, (Math.random() - .5) * 30);
      if (kind === "note") spawn("note float-up", pick(["♪", "♫", "♬"]), x, y, (Math.random() - .5) * 60);
      if (kind === "cure") spawn("cure float-up", "+", x, y, (Math.random() - .5) * 50);
      if (kind === "munch") spawn("munch float-up", pick(["냠", "냠냠", "오물"]), x + 40, y - 10, 20);
    }, i * 140);
  }
}
function motion(cls, ms) {
  const p = $("pet");
  stopWalking();
  p.classList.remove("eating", "dancing", "petted", "washing", "hopping");
  void p.offsetWidth;
  p.classList.add(cls);
  return new Promise((r) => setTimeout(() => { p.classList.remove(cls); r(); }, ms));
}
function bumpCoin(delta) {
  S.coins += delta;
  const c = $("coin"); c.classList.remove("bump"); void c.offsetWidth; c.classList.add("bump");
}
// 쓰다듬기·씻기기 코인: 날이 바뀌면 다시 HAND_CAP개까지
function handLeft() {
  const today = new Date().toDateString();
  if (S.handDay !== today) { S.handDay = today; S.handCoins = 0; }
  return HAND_CAP - S.handCoins;
}
function handCoin(n) {
  const got = Math.min(n, handLeft());
  if (got > 0) { S.handCoins += got; bumpCoin(got); }
  else if (!S.capNoticed) { S.capNoticed = S.handDay; toast("오늘 손으로 버는 코인은 다 받았어요. 텃밭에서 거둬 보세요"); }
  if (S.capNoticed && S.capNoticed !== S.handDay) S.capNoticed = null;
}
function toast(msg) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}

function gainXp(n) {
  S.xp += n;
  if (S.xp >= xpNeed(S.level)) {
    S.xp -= xpNeed(S.level); S.level += 1;
    const newPlot = plotsOpen(S.level) > plotsOpen(S.level - 1);
    setTimeout(() => {
      say(pick(CHARS[S.kind].lines.levelup), 4000); dance(false, true);
      if (newPlot) { toast("텃밭 한 칸이 새로 열렸어요"); renderGarden(); }
    }, 900);
  }
}

/* ---------- 행동 ---------- */
async function feed(food) {
  closeSheets();
  if (busy) return;
  // food.barn이 있으면 창고 작물을 먹이는 것(코인 대신 창고에서 하나 뺀다)
  if (!food.barn && S.coins < food.price) { toast("코인이 부족해요. 텃밭에서 거둬 팔아 보세요"); return; }
  busy = true;
  if (food.barn) S.barn[food.barn] -= 1;
  else bumpCoin(-food.price);
  const isFav = CHARS[S.kind].fav === food.id;
  // 음식이 날아와서 세 입에 사라진다
  const s = stageBox(), c = petCenter();
  const el = spawn("food-fly", food.icon || FOOD_ICONS[food.id], s.width - 60, 20);
  el.style.setProperty("--tx", `${c.x - (s.width - 60) - 22}px`);
  el.style.setProperty("--ty", `${c.y - 10}px`);
  await new Promise((r) => setTimeout(r, 600));
  const eat = motion("eating", 1700);
  burst("munch", 3);
  setTimeout(() => el.classList.add("bite1"), 450);
  setTimeout(() => el.classList.add("bite2"), 950);
  setTimeout(() => { el.style.opacity = "0"; }, 1400);
  await eat;
  S.full = clamp(S.full + food.full);
  S.mood = clamp(S.mood + food.mood + (isFav ? 15 : 0));
  gainXp(isFav ? 14 : 10);
  say(pick(CHARS[S.kind].lines[isFav ? "fav" : "feed"]));
  if (isFav) burst("heart", 4);
  save(); update(); busy = false;
}

async function wash() {
  if (busy) return;
  if (Date.now() < (S.washAt || 0) + 30000) { toast("방금 씻었어요. 조금 뒤에 다시 씻겨 주세요"); return; }
  busy = true;
  S.washAt = Date.now();
  burst("soap", 10);
  await motion("washing", 1450);
  S.clean = clamp(S.clean + 35);
  handCoin(2); gainXp(8);
  say(pick(CHARS[S.kind].lines.wash));
  save(); update(); busy = false;
}

async function pet() {
  if (busy) return;
  burst("heart", 2);
  motion("petted", 500);
  S.mood = clamp(S.mood + 6);
  const now = Date.now();
  if (now >= petCooldownUntil) { handCoin(1); gainXp(3); petCooldownUntil = now + 4000; }
  say(pick(CHARS[S.kind].lines.pet), 2500);
  save(); update();
}

// 아프거나 낮은 게이지(LOW 미만)가 있을 때만 치료할 수 있다
const healNeeded = () => S.sick || Object.keys(BASE_DECAY).some((k) => S[k] < LOW);
async function heal() {
  if (busy) return;
  if (!healNeeded()) { toast("지금은 건강해요"); return; }
  if (S.coins < HEAL_PRICE) { toast("코인이 부족해요. 텃밭에서 거둬 팔거나 쓰다듬기로 모아 보세요"); return; }
  busy = true;
  bumpCoin(-HEAL_PRICE);
  burst("cure", 6);
  await motion("petted", 800);
  for (const k of Object.keys(BASE_DECAY)) S[k] = Math.max(S[k], HEAL_TO);
  S.sick = false;
  gainXp(5);
  say(pick(CHARS[S.kind].lines.heal), 3500);
  motion("hopping", 700);
  burst("heart", 3);
  save(); update(); busy = false;
}

async function dance(gain = true, force = false) {
  if (busy && !force) return;
  if (gain && Date.now() < (S.danceAt || 0) + 20000) { toast("숨 좀 고르고 다시 춤출게요"); return; }
  busy = true;
  if (gain) S.danceAt = Date.now();
  const sulky = state() !== "idle" && state() !== "happy";
  burst("note", 6);
  if (gain) say(sulky ? "...지금은 기운이 없어도 한 번 해볼게." : pick(CHARS[S.kind].lines.dance), 2700);
  await motion("dancing", 2700);
  if (gain) { S.mood = clamp(S.mood + 12); S.full = clamp(S.full - 4); gainXp(5); }
  save(); update(); busy = false;
}

/* ---------- 시트 ---------- */
function openShop() {
  const c = CHARS[S.kind];
  $("shopSub").textContent = `가진 코인 ${S.coins}개 · ${c.name}의 최애는 ${FOODS.find((f) => f.id === c.fav).name}`;
  $("menu").innerHTML = "";
  for (const f of FOODS) {
    const b = document.createElement("button");
    b.className = "food"; b.disabled = S.coins < f.price;
    const fx = [`배부름 +${f.full}`, f.mood ? `기분 +${f.mood + (c.fav === f.id ? 15 : 0)}` : (c.fav === f.id ? "기분 +15" : "")].filter(Boolean).join(" · ");
    b.innerHTML = `${FOOD_ICONS[f.id]}<b>${f.name}${c.fav === f.id ? '<span class="fav">최애</span>' : ""}</b><small>${f.price}코인 · ${fx}</small>`;
    b.onclick = () => feed(f);
    $("menu").appendChild(b);
  }
  $("shop").hidden = false;
}
function closeSheets() { for (const id of ["shop", "settings", "seeds", "barn", "decor"]) $(id).hidden = true; }

/* ---------- 텃밭 ---------- */
let seedPlot = 0;
function plotState(p, now = Date.now()) {
  if (!p) return "empty";
  const ready = p.at + CROPS[p.crop].grow;
  return now < ready ? "growing" : now > ready + WITHER ? "withered" : "ready";
}
function fmtLeft(ms) {
  const s = Math.ceil(ms / 1000);
  if (s < 60) return `${s}초`;
  const m = Math.ceil(s / 60);
  if (m < 60) return `${m}분`;
  return m % 60 ? `${Math.floor(m / 60)}시간${m % 60}분` : `${m / 60}시간`;
}
// 오늘의 시세: 날짜마다 작물 하나를 골라 HOT_RATE배로 산다
function hotCrop() {
  const day = Math.floor((Date.now() - new Date().getTimezoneOffset() * MIN) / (24 * HOUR));
  const ids = Object.keys(CROPS);
  return ids[((day * 2654435761) >>> 0) % ids.length];
}
const sellPrice = (id) => id === hotCrop() ? Math.round(CROPS[id].sell * HOT_RATE) : CROPS[id].sell;
// 창고 작물을 feed()에 넘길 음식 모양으로
function cropFood(id) {
  const c = CROPS[id], as = c.eat.as && FOODS.find((f) => f.id === c.eat.as);
  return as ? { ...as, icon: FOOD_ICONS[as.id], barn: id }
            : { id, name: c.name, price: 0, full: c.eat.full, mood: c.eat.mood, icon: CROP_ICONS[id], barn: id };
}
const favCrop = (id) => cropFood(id).id === CHARS[S.kind].fav;
function renderGarden() {
  const box = $("plots"); box.innerHTML = "";
  for (let i = 0; i < MAX_PLOTS; i++) {
    const b = document.createElement("button");
    b.className = "plot"; b.dataset.i = i;
    b.onclick = () => plotClick(i);
    box.appendChild(b);
  }
  gardenTick();
}
// 매초: 칸 상태가 바뀐 곳만 다시 그리고, 자라는 중이면 남은 시간·막대만 갱신
function gardenTick() {
  const open = plotsOpen(S.level), now = Date.now();
  document.querySelectorAll(".plot").forEach((b) => {
    const i = +b.dataset.i, p = S.garden[i];
    const st = i >= open ? "locked" : plotState(p, now);
    const key = st + (p ? p.crop : "");
    if (b.dataset.key !== key) {
      b.dataset.key = key; b.className = "plot " + st;
      if (st === "locked") { b.innerHTML = `${LOCK_ICON}<span>Lv.${2 * i - 1}</span>`; b.setAttribute("aria-label", `Lv.${2 * i - 1}에 열리는 칸`); }
      else if (st === "empty") { b.innerHTML = `${PLUS_ICON}<span>심기</span>`; b.setAttribute("aria-label", "빈 칸, 씨앗 심기"); }
      else if (st === "growing") { b.innerHTML = `${SPROUT_ICON}<span></span><div class="prog"><i></i></div>`; }
      else { b.innerHTML = `${CROP_ICONS[p.crop]}<span>${st === "ready" ? "수확" : "시들었어요"}</span>`; b.setAttribute("aria-label", `${CROPS[p.crop].name} 거두기`); }
    }
    if (st === "growing") {
      const c = CROPS[p.crop], left = p.at + c.grow - now;
      b.querySelector("span").textContent = fmtLeft(left);
      b.querySelector(".prog i").style.width = `${100 - (left / c.grow) * 100}%`;
      b.setAttribute("aria-label", `${c.name} 자라는 중, ${fmtLeft(left)} 남음`);
    }
  });
}
function plotClick(i) {
  if (i >= plotsOpen(S.level)) { toast(`Lv.${2 * i - 1}이 되면 열려요`); return; }
  const p = S.garden[i], st = plotState(p);
  if (st === "empty") return openSeeds(i);
  if (st === "growing") { toast(`${CROPS[p.crop].name}: ${fmtLeft(p.at + CROPS[p.crop].grow - Date.now())} 뒤에 거둘 수 있어요`); return; }
  harvest(i, st === "withered");
}
function openSeeds(i) {
  seedPlot = i;
  $("seedsSub").textContent = `가진 코인 ${S.coins}개 · 오늘은 ${CROPS[hotCrop()].name} 값이 ${HOT_RATE}배`;
  $("seedMenu").innerHTML = "";
  for (const [id, c] of Object.entries(CROPS)) {
    const b = document.createElement("button");
    b.className = "food"; b.disabled = S.coins < c.seed;
    b.innerHTML = `${CROP_ICONS[id]}<b>${c.name}${favCrop(id) ? '<span class="fav">최애</span>' : ""}${id === hotCrop() ? '<span class="fav">시세↑</span>' : ""}</b><small>씨앗 ${c.seed}코인 · ${fmtLeft(c.grow)} · ${c.n}개 × ${sellPrice(id)}코인</small>`;
    b.onclick = () => plant(id);
    $("seedMenu").appendChild(b);
  }
  $("seeds").hidden = false;
}
function plant(id) {
  const c = CROPS[id];
  if (S.coins < c.seed) { toast("코인이 부족해요"); return; }
  closeSheets();
  bumpCoin(-c.seed);
  S.garden[seedPlot] = { crop: id, at: Date.now() };
  toast(`${c.name} 씨앗을 심었어요. ${fmtLeft(c.grow)} 뒤에 거둘 수 있어요`);
  save(); update();
}
function harvest(i, wilted) {
  const id = S.garden[i].crop, c = CROPS[id];
  const n = wilted ? Math.ceil(c.n / 2) : c.n;
  S.barn[id] = (S.barn[id] || 0) + n;
  S.garden[i] = null;
  gainXp(6);
  toast(`${wilted ? "조금 시든 " : ""}${c.name} ${n}개를 창고에 넣었어요`);
  if (!busy) { motion("hopping", 700); burst("heart", 3); }
  save(); update();
}
document.querySelectorAll(".scrim").forEach((s) => {
  s.addEventListener("click", (e) => { if (e.target === s || e.target.hasAttribute("data-close")) closeSheets(); });
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheets(); });

/* ---------- 방 꾸미기 ---------- */
function renderRoom(popId) {
  const room = $("room");
  room.classList.toggle("has-window", decorShown("window"));
  room.classList.toggle("has-plant", decorShown("plant"));
  room.innerHTML = Object.keys(DECOR).filter(decorShown)
    .map((id) => `<div class="d d-${id}${id === popId ? " pop" : ""}">${decorSvg(id)}</div>`).join("");
}
function openDecor() {
  const n = decorCount();
  $("decorSheetSub").textContent = `가진 코인 ${S.coins}개 · 놓은 가구 하나마다 기분이 ${DECOR_COZY * 100}% 천천히 줄어요${n ? ` (지금 ${Math.round(n * DECOR_COZY * 100)}%)` : ""}`;
  const menu = $("decorMenu"); menu.innerHTML = "";
  for (const [id, d] of Object.entries(DECOR)) {
    const owned = id in S.decor, needs = d.req && S.decor[d.req] !== true;
    const b = document.createElement("button");
    b.className = "food";
    b.disabled = !owned && (needs || S.coins < d.price);
    const state = !owned ? `${d.price}코인${needs ? ` · ${DECOR[d.req].name} 먼저` : ""}`
      : S.decor[id] ? (needs ? `${josa(DECOR[d.req].name, "이", "가")} 있어야 보여요` : "놓여 있어요 · 누르면 치워요") : "보관 중 · 누르면 놓아요";
    b.innerHTML = `${decorSvg(id)}<b>${d.name}${owned && S.decor[id] ? '<span class="fav">놓음</span>' : ""}</b><small>${state}</small>`;
    b.onclick = () => decorClick(id);
    menu.appendChild(b);
  }
  $("decor").hidden = false;
}
function decorClick(id) {
  const d = DECOR[id];
  if (!(id in S.decor)) {
    if (S.coins < d.price) { toast("코인이 부족해요. 텃밭에서 거둬 팔아 보세요"); return; }
    bumpCoin(-d.price);
    S.decor[id] = true;
    gainXp(10);
    toast(`${josa(d.name, "을", "를")} 들여놨어요`);
    say(pick(CHARS[S.kind].lines.happy));
    burst("heart", 3);
  } else {
    S.decor[id] = !S.decor[id];
  }
  renderRoom(S.decor[id] ? id : null);
  save(); update(); openDecor();
}
function showGarden(on) {
  closeSheets();
  $("home").hidden = on; $("gardenPage").hidden = !on;
  if (on) gardenTick();
  window.scrollTo(0, 0);
}

/* ---------- 창고 ---------- */
function openBarn() {
  const hot = hotCrop();
  $("barnSub").textContent = `오늘의 시세: ${CROPS[hot].name} ${HOT_RATE}배 · 팔면 코인, 먹이면 게이지가 올라요`;
  const list = $("barnList"); list.innerHTML = "";
  const have = Object.keys(CROPS).filter((id) => S.barn[id] > 0);
  if (!have.length) list.innerHTML = '<p class="barn-empty">아직 거둔 게 없어요. 텃밭에 씨앗을 심어 보세요</p>';
  for (const id of have) {
    const c = CROPS[id], f = cropFood(id), fav = favCrop(id);
    const fx = [f.full && `배부름 +${f.full}`, (f.mood || fav) && `기분 +${f.mood + (fav ? 15 : 0)}`].filter(Boolean).join(" · ");
    const row = document.createElement("div");
    row.className = "barn-row";
    row.innerHTML = `${CROP_ICONS[id]}<div><b>${c.name} ${S.barn[id]}개${fav ? '<span class="fav">최애</span>' : ""}${id === hot ? '<span class="fav">시세↑</span>' : ""}</b>` +
      `<small>${f.name !== c.name ? `${f.name}로 구워 먹여요 · ` : ""}${fx}</small></div>` +
      `<button class="eat">먹이기</button><button class="sell">팔기 +${sellPrice(id)}</button>`;
    row.querySelector(".eat").onclick = () => feed(f);
    row.querySelector(".sell").onclick = () => sellCrop(id);
    list.appendChild(row);
  }
  $("barn").hidden = false;
}
function sellCrop(id) {
  if (!(S.barn[id] > 0)) return;
  const price = sellPrice(id);
  S.barn[id] -= 1;
  bumpCoin(price);
  toast(`${CROPS[id].name} 하나 팔았어요 +${price}코인`);
  save(); update(); openBarn();
}

/* ---------- 화면 모드 ---------- */
function applyTheme(t) {
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.dataset.theme = t;
  document.querySelectorAll("#themeSeg button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.theme === t));
}
let theme = "auto";
theme = storeGet(THEME_KEY) || "auto";
applyTheme(theme);
document.querySelectorAll("#themeSeg button").forEach((b) => b.onclick = () => {
  theme = b.dataset.theme; applyTheme(theme);
  storeSet(THEME_KEY, theme);
});

let resetArmed = false;
$("resetBtn").onclick = () => {
  if (!resetArmed) { resetArmed = true; $("resetBtn").textContent = "한 번 더 누르면 초기화"; $("resetBtn").classList.add("danger"); return; }
  resetArmed = false; $("resetBtn").textContent = "다시 입양하기"; $("resetBtn").classList.remove("danger");
  storeSet(STORE_KEY, null);
  S = null; closeSheets(); clearTimeout(idleTimer); clearTimeout(wanderTimer); renderAdopt();
};
$("openSettings").onclick = () => {
  resetArmed = false; $("resetBtn").textContent = "다시 입양하기"; $("resetBtn").classList.remove("danger");
  $("settings").hidden = false;
};

$("actFeed").onclick = openShop;
$("openBarn").onclick = openBarn;
$("openDecor").onclick = openDecor;
$("openGarden").onclick = () => showGarden(true);
$("gardenBack").onclick = () => showGarden(false);
$("actWash").onclick = wash;
$("actPet").onclick = pet;
$("pet").onclick = pet;
$("actDance").onclick = () => dance(true);
$("actHeal").onclick = heal;

/* ---------- 시작 ---------- */
if (S && CHARS[S.kind]) {
  const away = Date.now() - S.last;
  decay(Date.now()); save();
  renderHome();
  const st = state();
  if (away > 10 * 60 * 1000) say(st === "idle" || st === "happy" ? "왔구나! " + pick(CHARS[S.kind].lines.idle) : pick(CHARS[S.kind].lines[st]), 4500);
  else say(pick(CHARS[S.kind].lines[st]));
  if (S.garden.some((p) => plotState(p) === "ready")) setTimeout(() => toast("텃밭에 거둘 게 있어요"), 1200);
} else {
  S = null; renderAdopt();
}
setInterval(() => { if (S) { decay(Date.now()); update(); } }, 1000);
setInterval(() => { if (S) save(); }, 10000);
document.addEventListener("visibilitychange", () => { if (S) { decay(Date.now()); update(); save(); } });
</script>
</body>
</html>
